<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anjo da Guarda</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root { --bg:#0b0f14; --card:#111827; --fg:#e8eef5; --ok:#22c55e; --alert:#ef4444; --muted:#8a96a3; --line:#374151; --blue:#3b82f6; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:system-ui,-apple-system,sans-serif; }
  header { padding:10px 16px; display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:8px; border-bottom:1px solid var(--line); }
  h1 { font-size:18px; margin:0; }
  #status { font-size:13px; color:var(--muted); }
  .abas { display:flex; gap:6px; flex-wrap:wrap; }
  button, select, input { background:#1f2937; color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:9px 12px; font-size:14px; }
  button.ativo, button.primary { background:var(--ok); color:#06210f; border:none; font-weight:700; }
  button:disabled { opacity:.5; }
  main { display:grid; grid-template-columns: 1fr 1fr; gap:12px; padding:12px 16px; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }
  #mapa { height:62vh; min-height:340px; border-radius:10px; }
  @media (max-width: 860px) { #mapa { height:42vh; } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px; }
  #stage { position:relative; width:100%; background:#000; border-radius:8px; overflow:hidden; min-height:200px; }
  video, #canvas { width:100%; display:block; }
  #canvas { position:absolute; inset:0; height:100%; }
  #recBadge { position:absolute; right:8px; top:8px; background:#ef4444; color:#fff; padding:4px 8px; border-radius:6px; font-size:13px; font-weight:700; display:none; }
  #camLabel { position:absolute; left:8px; top:8px; background:rgba(0,0,0,.6); padding:4px 8px; border-radius:6px; font-size:13px; }
  .painel { display:flex; flex-wrap:wrap; gap:14px; font-size:14px; margin:8px 0; }
  .alerta { padding:8px 10px; border-radius:8px; background:var(--alert); font-weight:700; display:none; margin:6px 0; }
  .controles { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .dica { font-size:12px; color:var(--muted); margin-top:6px; }
  .hidden { display:none !important; }
  .cam-pin { background:var(--blue); color:#fff; border:2px solid #fff; border-radius:50%; width:24px; height:24px; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; }
  .cam-pin.on { background:var(--ok); color:#06210f; transform:scale(1.25); }
  .leaflet-popup-content img { width:200px; border-radius:6px; display:block; }
</style>
</head>
<body>
<header>
  <h1>Anjo da Guarda <small style="font-size:12px;color:#8a96a3">v10</small></h1>
  <div class="abas">
    <button data-modo="sim" class="ativo">Simulação</button>
    <button data-modo="cel">Celular (câmera)</button>
    <button data-modo="central">Central (notebook)</button>
  </div>
  <span id="status">Carregando modelo de IA…</span>
</header>

<main>
  <div id="mapa"></div>

  <div class="card">
    <div id="stage">
      <video id="video" playsinline muted autoplay></video>
      <canvas id="canvas"></canvas>
      <div id="camLabel">Sem câmera ativa</div>
      <div id="recBadge">● REC 00:00</div>
    </div>
    <div class="painel">
      <span>Pessoas: <b id="pessoas">0</b></span>
      <span>Veículos: <b id="veiculos">0</b></span>
      <span>Únicos: <b id="unicos">0 pessoas · 0 veículos</b></span>
      <span>Câmeras: <b id="ncams">0</b></span>
      <span>Percorrido: <b id="dist">0 m</b></span>
      <span>FPS: <b id="fps">0</b></span>
    </div>
    <div id="alerta" class="alerta"></div>
    <div id="geoAlerta" class="alerta"></div>

    <!-- Simulação -->
    <div id="ctl-sim" class="controles">
      <select id="velocidade">
        <option value="1.4">A pé</option>
        <option value="5">Bike</option>
        <option value="12">Carro</option>
      </select>
      <button id="simIniciar" class="primary">Iniciar simulação</button>
      <button id="simParar">Parar</button>
      <button id="rotaDesenhar">Desenhar rota</button>
      <button id="rotaPadrao">Rota padrão</button>
    </div>

    <!-- Celular -->
    <div id="ctl-cel" class="controles hidden">
      <input id="codigoCel" placeholder="Código da central" value="paulo">
      <button id="celIniciar" class="primary">Iniciar e transmitir</button>
      <button id="celParar">Parar</button>
    </div>

    <!-- Central -->
    <div id="ctl-central" class="controles hidden">
      <input id="codigoCentral" placeholder="Código da central" value="paulo">
      <button id="centralAbrir" class="primary">Abrir central</button>
    </div>

    <div class="controles">
      <button id="seguir" class="ativo">Seguir: ligado</button>
      <button id="geoDesenhar">Desenhar área</button>
      <button id="geoLimpar">Limpar área</button>
      <button id="trocar">Trocar câmera</button>
      <button id="baixar">Baixar log (CSV)</button>
      <button id="baixarObj">Baixar objetos (CSV)</button>
    </div>
    <div class="controles">
      <button id="gravar">● Gravar</button>
      <label class="dica" style="display:flex;align-items:center;gap:6px;margin:0">
        <input type="checkbox" id="gravarAlertas" checked> Gravar automaticamente nos alertas
      </label>
      <span id="gravStatus" class="dica" style="margin:0"></span>
    </div>
    <div id="dica" class="dica"></div>
    <details class="dica" style="margin-top:10px">
      <summary>Configurar TURN (para transmitir pelo 4G)</summary>
      <div class="controles">
        <input id="turnUser" placeholder="Usuário (USERNAME)" autocomplete="off">
        <input id="turnPass" type="password" placeholder="Senha (PASSWORD)" autocomplete="off">
        <button id="turnSalvar">Salvar</button>
      </div>
      <div id="turnStatus">TURN: não configurado</div>
    </details>
  </div>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>window.L || document.write('<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"><script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"><\/script>');</script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
/* ===================== Configuração ===================== */
const CLASSES_INTERESSE = { person:"pessoa", bicycle:"bicicleta", car:"carro", motorcycle:"moto",
  bus:"ônibus", truck:"caminhão", knife:"faca", backpack:"mochila", handbag:"bolsa" };
const CLASSES_ALERTA = new Set(["knife"]);
const LIMIAR_PESSOAS = 8, LIMIAR_VEICULOS = 10, CONF = 0.4;
const ESPACO_CAMERAS = 50; // metros
const ROTA_PADRAO = [ // Ipanema – Rua Visconde de Pirajá
  [-22.98468,-43.19856],[-22.98430,-43.20280],[-22.98420,-43.20620],[-22.98450,-43.21000],[-22.98490,-43.21300]
];
const DICAS = {
  sim: "Simulação: o ponto percorre a rota no mapa, com câmeras a cada 50 m. A imagem vem da webcam (ou câmera do celular) e troca de câmera conforme o avanço.",
  cel: "Celular: abra a Central no notebook com o mesmo código, depois toque em Iniciar e caminhe. A cada 50 m o celular vira uma nova câmera.",
  central: "Central: clique em Abrir central e depois inicie o celular com o mesmo código. A imagem e a posição do celular aparecem aqui."
};

/* ===================== Elementos e estado ===================== */
const $ = id => document.getElementById(id);
const video = $("video"), canvas = $("canvas"), ctx = canvas.getContext("2d");
let modo = "sim", model = null, stream = null, detectando = false, facing = "environment";
let tPrev = performance.now(), ultimoLog = 0;
const log = [["timestamp","modo","lat","lng","camera","pessoas","veiculos","objetos","alertas","ids_visiveis"]];

let posAtual = null, camAtiva = null, percorrido = 0;
let cameras = []; // {id, lat, lng, marker, img}
let rota = ROTA_PADRAO.map(p => L.latLng(p[0], p[1]));
let simTimer = null, simDist = 0;
let desenhandoRota = false, desenhandoGeo = false;
let geoPontos = [], geoPoligono = null, dentroArea = true;
let peer = null, conn = null;

/* ===================== Mapa ===================== */
const mapa = L.map("mapa").setView([-22.9845, -43.2060], 16);
// Bases cartográficas gratuitas, com troca automática se uma falhar
const BASES = {
  "Ruas (Esri)": L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}",
    { maxZoom:19, attribution:"Tiles &copy; Esri" }),
  "Ruas (OpenStreetMap)": L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",
    { maxZoom:19, attribution:"&copy; OpenStreetMap" }),
  "Satélite (Esri)": L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
    { maxZoom:19, attribution:"Imagery &copy; Esri" })
};
const ordemBases = Object.values(BASES);
let baseAtual = 0, falhasBase = 0;
ordemBases[0].addTo(mapa);
L.control.layers(BASES, null, { position:"topright" }).addTo(mapa);
ordemBases.forEach((camada, i) => {
  camada.on("tileerror", () => {
    if (i !== baseAtual || ++falhasBase < 4 || baseAtual === ordemBases.length - 1) return;
    mapa.removeLayer(camada); baseAtual++; falhasBase = 0;
    ordemBases[baseAtual].addTo(mapa);
  });
  camada.on("load", () => { if (i === baseAtual) falhasBase = 0; });
});
mapa.on("baselayerchange", e => { baseAtual = ordemBases.indexOf(e.layer); falhasBase = 0; });
// Corrige mapa cinza/em branco no Safari quando a tela muda de tamanho
function ajustarMapa() { setTimeout(() => mapa.invalidateSize(), 250); }
window.addEventListener("resize", ajustarMapa);
window.addEventListener("orientationchange", ajustarMapa);
window.addEventListener("load", ajustarMapa);
let seguir = true;
const rotaLinha = L.polyline(rota, { color:"#3b82f6", weight:4, opacity:.6, dashArray:"6 6" }).addTo(mapa);
const trilha = L.polyline([], { color:"#22c55e", weight:5 }).addTo(mapa);
const usuario = L.circleMarker([0,0], { radius:9, color:"#fff", weight:3, fillColor:"#ef4444", fillOpacity:1 });

mapa.on("click", e => {
  if (desenhandoRota) {
    rota.push(e.latlng); rotaLinha.setLatLngs(rota);
  } else if (desenhandoGeo) {
    geoPontos.push(e.latlng);
    if (!geoPoligono) geoPoligono = L.polygon(geoPontos, { color:"#f59e0b", fillOpacity:.12 }).addTo(mapa);
    else geoPoligono.setLatLngs(geoPontos);
  }
});

function dist(a, b) { return L.latLng(a).distanceTo(L.latLng(b)); }

function dentroPoligono(p, poly) {
  let dentro = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const xi = poly[i].lng, yi = poly[i].lat, xj = poly[j].lng, yj = poly[j].lat;
    if (((yi > p.lat) !== (yj > p.lat)) && (p.lng < (xj - xi) * (p.lat - yi) / (yj - yi) + xi)) dentro = !dentro;
  }
  return dentro;
}

/* ===================== Câmeras ===================== */
function snapshot() {
  if (!video.videoWidth) return null;
  const c = document.createElement("canvas");
  c.width = 320; c.height = Math.round(320 * video.videoHeight / video.videoWidth);
  c.getContext("2d").drawImage(video, 0, 0, c.width, c.height);
  return c.toDataURL("image/jpeg", 0.6);
}

function criarCamera(lat, lng, img, idForcado) {
  const id = idForcado || cameras.length + 1;
  const icon = L.divIcon({ className:"", html:`<div class="cam-pin" id="pin${id}">${id}</div>`, iconSize:[24,24], iconAnchor:[12,12] });
  const marker = L.marker([lat, lng], { icon }).addTo(mapa);
  const cam = { id, lat, lng, marker, img };
  atualizarPopup(cam);
  cameras.push(cam);
  $("ncams").textContent = cameras.length;
  return cam;
}

function atualizarPopup(cam) {
  cam.marker.bindPopup(`<b>Câmera ${cam.id}</b><br>${cam.img ? `<img src="${cam.img}">` : "Sem imagem ainda"}`);
}

function ativarCamera(cam) {
  if (camAtiva === cam) return;
  if (camAtiva) document.getElementById("pin" + camAtiva.id)?.classList.remove("on");
  camAtiva = cam;
  document.getElementById("pin" + cam.id)?.classList.add("on");
  $("camLabel").textContent = `Câmera ${cam.id} · ao vivo`;
}

function camMaisProxima(p) {
  let melhor = null, dMin = Infinity;
  for (const c of cameras) { const d = dist(p, [c.lat, c.lng]); if (d < dMin) { dMin = d; melhor = c; } }
  return { cam: melhor, d: dMin };
}

/* ===================== Posição (comum a todos os modos) ===================== */
function novaPosicao(lat, lng, origemCel = false) {
  const p = L.latLng(lat, lng);
  if (posAtual) percorrido += dist(posAtual, p);
  posAtual = p;
  if (!mapa.hasLayer(usuario)) usuario.addTo(mapa);
  usuario.setLatLng(p);
  trilha.addLatLng(p);
  $("dist").textContent = `${Math.round(percorrido)} m`;
  if (seguir) mapa.setView(p, mapa.getZoom(), { animate:true });
  else if (!mapa.getBounds().pad(-0.2).contains(p)) mapa.panTo(p);

  // Celular: vira nova câmera a cada 50 m
  if (origemCel) {
    const ultima = cameras[cameras.length - 1];
    if (!ultima || dist(p, [ultima.lat, ultima.lng]) >= ESPACO_CAMERAS) {
      const cam = criarCamera(lat, lng, snapshot());
      enviar({ tipo:"cam", id:cam.id, lat, lng, img:cam.img });
    }
  }
  const { cam } = camMaisProxima(p);
  if (cam) ativarCamera(cam);

  // Geofence
  if (geoPontos.length >= 3) {
    const dentro = dentroPoligono(p, geoPontos);
    $("geoAlerta").style.display = dentro ? "none" : "block";
    $("geoAlerta").textContent = "ALERTA: fora da área delimitada";
    if (!dentro && dentroArea && navigator.vibrate) navigator.vibrate([200,100,200]);
    dentroArea = dentro;
  }
}

/* ===================== Câmera local ===================== */
async function abrirCameraLocal() {
  pararStream();
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: facing, width:{ ideal:1280 }, height:{ ideal:720 } }, audio:false
    });
  } catch (e) { $("status").textContent = "Sem acesso à câmera: " + e.message; return false; }
  video.srcObject = stream;
  await video.play().catch(() => {});
  iniciarDeteccao();
  return true;
}

function pararStream() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null;
}

/* ===================== Detecção ===================== */
function iniciarDeteccao() {
  if (detectando || !model) return;
  detectando = true;
  loop();
}

async function loop() {
  if (!detectando) return;
  if (video.readyState < 2 || !video.videoWidth) { requestAnimationFrame(loop); return; }
  if (canvas.width !== video.videoWidth) { canvas.width = video.videoWidth; canvas.height = video.videoHeight; }

  const preds = await model.detect(video, 20, CONF);
  const tAgora = performance.now();
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const contagem = {};
  const dets = [];
  for (const p of preds) {
    if (!(p.class in CLASSES_INTERESSE)) continue;
    contagem[p.class] = (contagem[p.class] || 0) + 1;
    dets.push({ classe:p.class, bbox:p.bbox, score:p.score });
  }
  atualizarRastreamento(dets, tAgora);

  // Desenha só os objetos vistos neste quadro, com o ID de cada um
  for (const t of tracks) {
    if (t.ultimo !== tAgora) continue;
    const [x, y, w, h] = t.bbox;
    const cor = CLASSES_ALERTA.has(t.classe) ? "#ef4444" : (t.id ? "#22c55e" : "#9ca3af");
    ctx.strokeStyle = cor; ctx.lineWidth = 3; ctx.strokeRect(x, y, w, h);
    const rotulo = `${CLASSES_INTERESSE[t.classe]} ${t.id ? "#" + t.id : "…"}`;
    ctx.font = "16px system-ui";
    const tw = ctx.measureText(rotulo).width + 8;
    ctx.fillStyle = cor; ctx.fillRect(x, Math.max(y - 20, 0), tw, 20);
    ctx.fillStyle = "#000"; ctx.fillText(rotulo, x + 4, Math.max(y - 5, 15));
  }
  const pessoas = contagem.person || 0;
  const veiculos = ["car","motorcycle","bus","truck"].reduce((s, c) => s + (contagem[c] || 0), 0);
  const alertas = [];
  if ([...CLASSES_ALERTA].some(c => contagem[c])) alertas.push("OBJETO PERIGOSO");
  if (pessoas >= LIMIAR_PESSOAS) alertas.push("AGLOMERAÇÃO");
  if (veiculos >= LIMIAR_VEICULOS) alertas.push("ENGARRAFAMENTO");

  const agora = performance.now();
  $("fps").textContent = (1000 / Math.max(agora - tPrev, 1)).toFixed(1);
  tPrev = agora;
  $("pessoas").textContent = pessoas;
  $("veiculos").textContent = veiculos;
  if (alertas.length) aoAlerta(alertas);
  $("alerta").style.display = alertas.length ? "block" : "none";
  $("alerta").textContent = "ALERTA: " + alertas.join(" | ") + (camAtiva ? ` (Câmera ${camAtiva.id})` : "");
  if (alertas.length && camAtiva) {
    const pin = document.getElementById("pin" + camAtiva.id);
    if (pin) pin.style.background = "#ef4444";
  } else if (camAtiva) {
    const pin = document.getElementById("pin" + camAtiva.id);
    if (pin) pin.style.background = "";
  }

  if (alertas.length || agora - ultimoLog >= 1000) {
    const idsVisiveis = tracks.filter(t => t.id && t.ultimo === tAgora).map(t => t.id).join(";");
    log.push([new Date().toISOString(), modo, posAtual?.lat?.toFixed(6) ?? "", posAtual?.lng?.toFixed(6) ?? "",
      camAtiva?.id ?? "", pessoas, veiculos,
      Object.entries(contagem).map(([k, v]) => `${k}=${v}`).join(";"), alertas.join(";"), idsVisiveis]);
    ultimoLog = agora;
  }
  requestAnimationFrame(loop);
}

/* ===================== Gravação (central) ===================== */
// Grava o vídeo com as caixas de detecção, IDs, data/hora e câmera impressos na imagem.
const POS_ALERTA_MS = 10000;   // continua gravando 10 s após o último alerta
const MAX_GRAVACAO_MS = 10 * 60 * 1000; // divide arquivos longos a cada 10 min
let gravando = false, gravador = null, pedacos = [], motivoGrav = "", inicioGrav = 0;
let ultimoAlertaMs = 0, timerComp = null, alertasGrav = new Set();
const compCanvas = document.createElement("canvas");
const compCtx = compCanvas.getContext("2d");

function tipoVideo() {
  const tipos = ["video/mp4;codecs=avc1", "video/mp4", "video/webm;codecs=vp9", "video/webm;codecs=vp8", "video/webm"];
  return tipos.find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || "";
}

function desenharComposicao() {
  if (!video.videoWidth) return;
  if (compCanvas.width !== video.videoWidth) { compCanvas.width = video.videoWidth; compCanvas.height = video.videoHeight; }
  const W = compCanvas.width, H = compCanvas.height;
  compCtx.drawImage(video, 0, 0, W, H);
  compCtx.drawImage(canvas, 0, 0, W, H);
  const txt = `${new Date().toLocaleString("pt-BR")}  ·  Câmera ${camAtiva?.id ?? "-"}` +
    (posAtual ? `  ·  ${posAtual.lat.toFixed(5)}, ${posAtual.lng.toFixed(5)}` : "");
  const fs = Math.max(14, Math.round(H / 32));
  compCtx.font = `${fs}px system-ui`;
  const tw = compCtx.measureText(txt).width + 16;
  compCtx.fillStyle = "rgba(0,0,0,.6)"; compCtx.fillRect(0, H - fs - 14, tw, fs + 14);
  compCtx.fillStyle = "#fff"; compCtx.fillText(txt, 8, H - 10);
  const seg = Math.floor((performance.now() - inicioGrav) / 1000);
  $("recBadge").textContent = `● REC ${String(Math.floor(seg / 60)).padStart(2, "0")}:${String(seg % 60).padStart(2, "0")}`;
  if (performance.now() - inicioGrav > MAX_GRAVACAO_MS) { const m = motivoGrav; pararGravacao(); iniciarGravacao(m); }
  if (motivoGrav === "alerta" && performance.now() - ultimoAlertaMs > POS_ALERTA_MS) pararGravacao();
}

function iniciarGravacao(motivo) {
  if (gravando) return;
  if (!video.srcObject || !video.videoWidth) { $("gravStatus").textContent = "Sem imagem para gravar"; return; }
  const tipo = tipoVideo();
  if (!tipo) { $("gravStatus").textContent = "Este navegador não grava vídeo"; return; }
  compCanvas.width = video.videoWidth; compCanvas.height = video.videoHeight;
  desenharComposicaoInicial();
  const fluxo = compCanvas.captureStream(15);
  pedacos = [];
  try { gravador = new MediaRecorder(fluxo, { mimeType:tipo, videoBitsPerSecond:2500000 }); }
  catch (e) { $("gravStatus").textContent = "Erro ao gravar: " + e.message; return; }
  gravador.ondataavailable = e => { if (e.data.size) pedacos.push(e.data); };
  const meta = { motivo, camera:camAtiva?.id ?? "", inicio:new Date(), tipo };
  gravador.onstop = () => salvarGravacao(meta);
  gravador.start(1000);
  gravando = true; motivoGrav = motivo; inicioGrav = performance.now(); alertasGrav = new Set();
  timerComp = setInterval(desenharComposicao, 1000 / 15);
  $("recBadge").style.display = "block";
  $("gravar").textContent = "■ Parar gravação"; $("gravar").classList.add("ativo");
  $("gravStatus").textContent = motivo === "alerta" ? "Gravando alerta…" : "Gravando…";
}

function desenharComposicaoInicial() { try { desenharComposicao(); } catch {} }

function pararGravacao() {
  if (!gravando) return;
  gravando = false;
  clearInterval(timerComp); timerComp = null;
  try { gravador.stop(); } catch {}
  $("recBadge").style.display = "none";
  $("gravar").textContent = "● Gravar"; $("gravar").classList.remove("ativo");
}

function salvarGravacao(meta) {
  const ext = meta.tipo.includes("mp4") ? "mp4" : "webm";
  const blob = new Blob(pedacos, { type:meta.tipo.split(";")[0] });
  const carimbo = meta.inicio.toISOString().slice(0,19).replace(/[:T]/g, "");
  const extra = alertasGrav.size ? "_" + [...alertasGrav].join("-").normalize("NFD").replace(/[^A-Za-z-]/g, "") : "";
  const nome = `anjo_cam${meta.camera || "x"}_${carimbo}_${meta.motivo}${extra}.${ext}`;
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = nome; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 60000);
  log.push([new Date().toISOString(), modo, posAtual?.lat?.toFixed(6) ?? "", posAtual?.lng?.toFixed(6) ?? "",
    meta.camera, "", "", "", "GRAVACAO:" + nome, ""]);
  $("gravStatus").textContent = `Salvo: ${nome} (${(blob.size / 1048576).toFixed(1)} MB)`;
}

function aoAlerta(alertas) {
  ultimoAlertaMs = performance.now();
  if (gravando) { alertas.forEach(a => alertasGrav.add(a)); return; }
  if ($("gravarAlertas").checked) { iniciarGravacao("alerta"); alertas.forEach(a => alertasGrav.add(a)); }
}

/* ===================== Rastreamento: um ID por objeto ===================== */
const CONFIRMA_QUADROS = 3;   // objeto precisa aparecer em 3 quadros para ganhar ID (evita falsos positivos)
const PERDA_MS = 1500;        // some por mais de 1,5 s = objeto encerrado
let tracks = [], proxId = 1, unicos = {};
const objetosLog = [["id","classe","primeira_vez","ultima_vez","segundos_visivel","camera","lat","lng"]];

function iou(a, b) {
  const x1 = Math.max(a[0], b[0]), y1 = Math.max(a[1], b[1]);
  const x2 = Math.min(a[0] + a[2], b[0] + b[2]), y2 = Math.min(a[1] + a[3], b[1] + b[3]);
  const inter = Math.max(0, x2 - x1) * Math.max(0, y2 - y1);
  return inter / (a[2] * a[3] + b[2] * b[3] - inter || 1);
}

function semelhanca(t, d) {
  if (t.classe !== d.classe) return 0;
  const v = iou(t.bbox, d.bbox);
  if (v > 0.2) return v;
  // Câmera em movimento: aceita também quando os centros estão próximos
  const cx = (b) => [b[0] + b[2] / 2, b[1] + b[3] / 2];
  const [ax, ay] = cx(t.bbox), [bx, by] = cx(d.bbox);
  const lim = 0.5 * Math.sqrt(t.bbox[2] * t.bbox[3]);
  return Math.hypot(ax - bx, ay - by) < lim ? 0.1 : 0;
}

function atualizarRastreamento(dets, agora) {
  const pares = [];
  tracks.forEach((t, ti) => dets.forEach((d, di) => {
    const s = semelhanca(t, d); if (s > 0) pares.push([s, ti, di]);
  }));
  pares.sort((a, b) => b[0] - a[0]);
  const tUsado = new Set(), dUsado = new Set();
  for (const [, ti, di] of pares) {
    if (tUsado.has(ti) || dUsado.has(di)) continue;
    tUsado.add(ti); dUsado.add(di);
    const t = tracks[ti];
    t.bbox = dets[di].bbox; t.ultimo = agora; t.ultimoISO = new Date().toISOString(); t.quadros++;
    if (!t.id && t.quadros >= CONFIRMA_QUADROS) confirmar(t);
  }
  dets.forEach((d, di) => {
    if (dUsado.has(di)) return;
    tracks.push({ classe:d.classe, bbox:d.bbox, quadros:1, id:null,
      primeiro:agora, ultimo:agora, primeiroISO:new Date().toISOString(), ultimoISO:new Date().toISOString(),
      camera:camAtiva?.id ?? "", lat:posAtual?.lat, lng:posAtual?.lng });
  });
  tracks = tracks.filter(t => {
    if (agora - t.ultimo <= PERDA_MS) return true;
    if (t.id) registrarObjeto(t);
    return false;
  });
}

function confirmar(t) {
  t.id = proxId++;
  unicos[t.classe] = (unicos[t.classe] || 0) + 1;
  const up = unicos.person || 0;
  const uv = ["car","motorcycle","bus","truck"].reduce((s, c) => s + (unicos[c] || 0), 0);
  $("unicos").textContent = `${up} pessoas · ${uv} veículos`;
}

function registrarObjeto(t) {
  objetosLog.push([t.id, CLASSES_INTERESSE[t.classe], t.primeiroISO, t.ultimoISO,
    ((t.ultimo - t.primeiro) / 1000).toFixed(1), t.camera,
    t.lat?.toFixed(6) ?? "", t.lng?.toFixed(6) ?? ""]);
}

function resetRastreamento() {
  tracks = []; proxId = 1; unicos = {};
  objetosLog.length = 1;
  $("unicos").textContent = "0 pessoas · 0 veículos";
}

/* ===================== Modo Simulação ===================== */
function pontoNaRota(d) {
  let acum = 0;
  for (let i = 1; i < rota.length; i++) {
    const seg = rota[i - 1].distanceTo(rota[i]);
    if (acum + seg >= d) {
      const f = (d - acum) / seg;
      return L.latLng(rota[i-1].lat + (rota[i].lat - rota[i-1].lat) * f, rota[i-1].lng + (rota[i].lng - rota[i-1].lng) * f);
    }
    acum += seg;
  }
  return null;
}

function comprimentoRota() {
  let t = 0; for (let i = 1; i < rota.length; i++) t += rota[i-1].distanceTo(rota[i]); return t;
}

function prepararCamerasRota() {
  limparCameras();
  const total = comprimentoRota();
  for (let d = 0; d <= total; d += ESPACO_CAMERAS) {
    const p = pontoNaRota(d); if (p) criarCamera(p.lat, p.lng, null);
  }
}

async function iniciarSimulacao() {
  if (rota.length < 2) { $("status").textContent = "Desenhe uma rota com pelo menos 2 pontos"; return; }
  pararSimulacao();
  desenhandoRota = false; $("rotaDesenhar").classList.remove("ativo");
  resetTrajeto();
  prepararCamerasRota();
  mapa.fitBounds(rotaLinha.getBounds().pad(0.2));
  if (!stream) await abrirCameraLocal();
  $("status").textContent = "Simulando trajeto…";
  simDist = 0;
  const passoMs = 500;
  simTimer = setInterval(() => {
    const vel = parseFloat($("velocidade").value);
    simDist += vel * passoMs / 1000;
    const p = pontoNaRota(simDist);
    if (!p) { pararSimulacao(); $("status").textContent = "Simulação concluída"; return; }
    novaPosicao(p.lat, p.lng);
    if (camAtiva && !camAtiva.img) { camAtiva.img = snapshot(); atualizarPopup(camAtiva); }
  }, passoMs);
}

function pararSimulacao() { if (simTimer) clearInterval(simTimer); simTimer = null; }

/* ===================== Modo Celular ===================== */
let watchId = null;
async function iniciarCelular() {
  const codigo = $("codigoCel").value.trim();
  if (!codigo) return;
  resetTrajeto(); limparCameras();
  if (!await abrirCameraLocal()) return;

  if (!navigator.geolocation) { $("status").textContent = "GPS indisponível neste aparelho"; return; }
  watchId = navigator.geolocation.watchPosition(
    pos => {
      const { latitude:lat, longitude:lng, accuracy } = pos.coords;
      if (!posAtual) mapa.setView([lat, lng], 17);
      novaPosicao(lat, lng, true);
      enviar({ tipo:"pos", lat, lng, acc:accuracy });
    },
    e => $("status").textContent = "Erro de GPS: " + e.message,
    { enableHighAccuracy:true, maximumAge:1000, timeout:15000 }
  );

  transmitindo = true;
  codigoAtual = codigo;
  manterTelaAcesa();
  conectarCentral();
  $("status").textContent = "Câmera e GPS ativos — conectando à central…";
}

/* Conexão com a central (usada no início e na reconexão automática) */
let transmitindo = false, codigoAtual = "", chamadaAtual = null, wakeLock = null;
function ligarParaCentral(p) {
  const idCentral = "anjo-guarda-" + codigoAtual;
  if (chamadaAtual) { try { chamadaAtual.close(); } catch {} }
  chamadaAtual = p.call(idCentral, stream);
  chamadaAtual?.peerConnection?.addEventListener("iceconnectionstatechange", () => {
    const st = chamadaAtual.peerConnection.iceConnectionState;
    if (st === "failed") $("status").textContent = "Vídeo não conectou — configure o TURN para usar no 4G";
  });
  if (!conn || !conn.open) {
    conn = p.connect(idCentral, { reliable:true });
    conn.on("open", () => $("status").textContent = "Transmitindo para a central");
    conn.on("data", d => { if (d.tipo === "geo") definirGeo(d.pontos); });
    conn.on("close", () => { if (transmitindo) $("status").textContent = "Central desconectada"; });
  }
}
function conectarCentral() {
  if (peer && !peer.destroyed && !peer.disconnected) { ligarParaCentral(peer); return; }
  if (peer && peer.disconnected && !peer.destroyed) { peer.reconnect(); peer.once("open", () => ligarParaCentral(peer)); return; }
  conectarPeer(null, p => ligarParaCentral(p));
}

/* Tela sempre acesa enquanto transmite (Safari 16.4+) */
async function manterTelaAcesa() {
  try { if ("wakeLock" in navigator && document.visibilityState === "visible") wakeLock = await navigator.wakeLock.request("screen"); }
  catch {}
}

/* Segundo plano: o iOS desliga a câmera; ao voltar, religa e reconecta sozinho */
document.addEventListener("visibilitychange", async () => {
  if (modo !== "cel" || !transmitindo) return;
  if (document.visibilityState === "hidden") {
    enviar({ tipo:"pausa" });
    return;
  }
  $("status").textContent = "De volta — religando câmera…";
  manterTelaAcesa();
  const cameraParada = !stream || stream.getVideoTracks().every(t => t.readyState === "ended" || t.muted);
  if (cameraParada) { if (!await abrirCameraLocal()) return; }
  conectarCentral();
  enviar({ tipo:"retomada" });
});

function pararCelular() {
  transmitindo = false;
  if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
  if (chamadaAtual) { try { chamadaAtual.close(); } catch {} chamadaAtual = null; }
  if (watchId !== null) navigator.geolocation.clearWatch(watchId);
  watchId = null;
  pararStream();
  if (peer) peer.destroy(); peer = null; conn = null;
  $("status").textContent = "Parado";
}

/* ===================== Modo Central ===================== */
function abrirCentral() {
  const codigo = $("codigoCentral").value.trim();
  if (!codigo) return;
  resetTrajeto(); limparCameras();
  conectarPeer("anjo-guarda-" + codigo, p => {
    $("status").textContent = `Central aberta (código: ${codigo}) — aguardando celular`;
    p.on("call", call => {
      call.answer();
      call.on("stream", s => {
        video.srcObject = s; video.play().catch(() => {});
        $("status").textContent = "Recebendo imagem do celular";
        iniciarDeteccao();
      });
    });
    p.on("connection", c => {
      conn = c;
      c.on("open", () => { if (geoPontos.length >= 3) enviar({ tipo:"geo", pontos:geoPontos.map(q => [q.lat, q.lng]) }); });
      c.on("data", d => {
        if (d.tipo === "pos") novaPosicao(d.lat, d.lng);
        if (d.tipo === "pausa") $("status").textContent = "Celular em segundo plano — transmissão pausada";
        if (d.tipo === "retomada") $("status").textContent = "Celular voltou — reconectando imagem…";
        if (d.tipo === "cam") { criarCamera(d.lat, d.lng, d.img, d.id); if (posAtual) ativarCamera(camMaisProxima(posAtual).cam); }
      });
      c.on("close", () => $("status").textContent = "Celular desconectado");
    });
  });
}

/* ===================== Comunicação (PeerJS) ===================== */
/* TURN (retransmissão) — necessário quando o celular está no 4G/5G.
   Credencial gratuita do Metered (usuário e senha), salva só neste aparelho. */
function lerCfg(k) { try { return localStorage.getItem(k) || ""; } catch { return ""; } }
function salvarCfg(k, v) { try { localStorage.setItem(k, v); } catch {} }

async function iceServers() {
  const base = [{ urls:"stun:stun.l.google.com:19302" }, { urls:"stun:stun.relay.metered.ca:80" }];
  const user = lerCfg("turnUser").trim(), pass = lerCfg("turnPass").trim();
  if (!user || !pass) { $("turnStatus").textContent = "TURN: não configurado (só funciona no mesmo Wi-Fi)"; return base; }
  $("turnStatus").textContent = "TURN: ativo";
  const h = "global.relay.metered.ca";
  return base.concat([
    { urls:`turn:${h}:80`, username:user, credential:pass },
    { urls:`turn:${h}:80?transport=tcp`, username:user, credential:pass },
    { urls:`turn:${h}:443`, username:user, credential:pass },
    { urls:`turns:${h}:443?transport=tcp`, username:user, credential:pass }
  ]);
}

async function conectarPeer(id, aoAbrir) {
  if (peer) peer.destroy();
  const config = { iceServers: await iceServers() };
  peer = id ? new Peer(id, { config }) : new Peer({ config });
  peer.on("open", () => aoAbrir(peer));
  peer.on("error", e => {
    const msg = e.type === "unavailable-id" ? "Código em uso — escolha outro"
      : e.type === "peer-unavailable" ? "Central não encontrada — abra a Central no notebook primeiro"
      : "Erro de conexão: " + e.type;
    $("status").textContent = msg;
  });
}

function enviar(obj) { if (conn && conn.open) conn.send(obj); }

/* ===================== Área delimitada ===================== */
function definirGeo(pontos) {
  geoPontos = pontos.map(p => L.latLng(p[0], p[1]));
  if (geoPoligono) mapa.removeLayer(geoPoligono);
  geoPoligono = geoPontos.length ? L.polygon(geoPontos, { color:"#f59e0b", fillOpacity:.12 }).addTo(mapa) : null;
  dentroArea = true;
}

/* ===================== Utilidades ===================== */
function resetTrajeto() {
  resetRastreamento();
  posAtual = null; percorrido = 0; trilha.setLatLngs([]);
  if (mapa.hasLayer(usuario)) mapa.removeLayer(usuario);
  $("dist").textContent = "0 m";
}

function limparCameras() {
  cameras.forEach(c => mapa.removeLayer(c.marker));
  cameras = []; camAtiva = null;
  $("ncams").textContent = 0; $("camLabel").textContent = "Sem câmera ativa";
}

function baixarCSV(linhas, prefixo) {
  const csv = linhas.map(l => l.map(v => `"${String(v).replace(/"/g, '""')}"`).join(",")).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type:"text/csv" }));
  a.download = `${prefixo}_${new Date().toISOString().slice(0,19).replace(/[:T]/g, "")}.csv`;
  a.click();
}

function baixarObjetos() {
  // inclui os objetos ainda visíveis
  const ativos = tracks.filter(t => t.id).map(t => [t.id, CLASSES_INTERESSE[t.classe], t.primeiroISO, t.ultimoISO,
    ((t.ultimo - t.primeiro) / 1000).toFixed(1), t.camera, t.lat?.toFixed(6) ?? "", t.lng?.toFixed(6) ?? ""]);
  baixarCSV(objetosLog.concat(ativos), "anjo_objetos");
}

function baixarLog() {
  const csv = log.map(l => l.map(v => `"${String(v).replace(/"/g, '""')}"`).join(",")).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type:"text/csv" }));
  a.download = `anjo_log_${new Date().toISOString().slice(0,19).replace(/[:T]/g, "")}.csv`;
  a.click();
}

function trocarModo(novo) {
  pararSimulacao();
  if (modo === "cel") pararCelular();
  modo = novo;
  document.querySelectorAll("[data-modo]").forEach(b => b.classList.toggle("ativo", b.dataset.modo === novo));
  ["sim","cel","central"].forEach(m => $("ctl-" + m).classList.toggle("hidden", m !== novo));
  $("trocar").classList.toggle("hidden", novo === "central");
  $("dica").textContent = DICAS[novo];
  if (novo === "sim") prepararCamerasRota(); else limparCameras();
  resetTrajeto();
  ajustarMapa();
}

/* ===================== Eventos ===================== */
document.querySelectorAll("[data-modo]").forEach(b => b.onclick = () => trocarModo(b.dataset.modo));
$("simIniciar").onclick = iniciarSimulacao;
$("simParar").onclick = () => { pararSimulacao(); $("status").textContent = "Simulação parada"; };
$("rotaDesenhar").onclick = () => {
  desenhandoRota = !desenhandoRota; desenhandoGeo = false;
  $("rotaDesenhar").classList.toggle("ativo", desenhandoRota); $("geoDesenhar").classList.remove("ativo");
  if (desenhandoRota) { pararSimulacao(); rota = []; rotaLinha.setLatLngs(rota); limparCameras(); resetTrajeto();
    $("status").textContent = "Clique no mapa para traçar a rota; depois clique em Iniciar simulação"; }
};
$("seguir").onclick = () => {
  seguir = !seguir;
  $("seguir").classList.toggle("ativo", seguir);
  $("seguir").textContent = "Seguir: " + (seguir ? "ligado" : "desligado");
  if (seguir && posAtual) mapa.setView(posAtual, Math.max(mapa.getZoom(), 17));
};
$("rotaPadrao").onclick = () => {
  rota = ROTA_PADRAO.map(p => L.latLng(p[0], p[1])); rotaLinha.setLatLngs(rota);
  prepararCamerasRota(); resetTrajeto(); mapa.fitBounds(rotaLinha.getBounds().pad(0.2));
};
$("celIniciar").onclick = iniciarCelular;
$("celParar").onclick = pararCelular;
$("centralAbrir").onclick = abrirCentral;
$("geoDesenhar").onclick = () => {
  desenhandoGeo = !desenhandoGeo; desenhandoRota = false;
  $("geoDesenhar").classList.toggle("ativo", desenhandoGeo); $("rotaDesenhar").classList.remove("ativo");
  if (desenhandoGeo) { definirGeo([]); $("status").textContent = "Clique no mapa para marcar os vértices da área; clique de novo em Desenhar área para concluir"; }
  else { $("status").textContent = geoPontos.length >= 3 ? "Área definida" : "Área precisa de pelo menos 3 pontos";
    if (geoPontos.length >= 3) enviar({ tipo:"geo", pontos:geoPontos.map(q => [q.lat, q.lng]) }); }
};
$("geoLimpar").onclick = () => { definirGeo([]); $("geoAlerta").style.display = "none"; enviar({ tipo:"geo", pontos:[] }); };
$("trocar").onclick = () => { facing = facing === "environment" ? "user" : "environment"; if (stream) abrirCameraLocal(); };
$("baixar").onclick = baixarLog;
$("turnUser").value = lerCfg("turnUser");
$("turnPass").value = lerCfg("turnPass");
$("turnSalvar").onclick = async () => {
  salvarCfg("turnUser", $("turnUser").value.trim());
  salvarCfg("turnPass", $("turnPass").value.trim());
  await iceServers();
};
iceServers();
$("baixarObj").onclick = baixarObjetos;
$("gravar").onclick = () => gravando ? pararGravacao() : iniciarGravacao("manual");
$("gravarAlertas").checked = lerCfg("gravarAlertas") !== "0";
$("gravarAlertas").onchange = () => salvarCfg("gravarAlertas", $("gravarAlertas").checked ? "1" : "0");

/* ===================== Início ===================== */
$("dica").textContent = DICAS.sim;
prepararCamerasRota();
mapa.fitBounds(rotaLinha.getBounds().pad(0.2));
cocoSsd.load({ base:"lite_mobilenet_v2" })
  .then(m => { model = m; $("status").textContent = "Pronto"; if (video.srcObject) iniciarDeteccao(); })
  .catch(e => $("status").textContent = "Erro ao carregar IA: " + e.message);
</script>
