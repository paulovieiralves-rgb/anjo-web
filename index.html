<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anjo da Guarda</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root { --bg:#0b0f14; --card:#111827; --fg:#e8eef5; --ok:#22c55e; --alert:#ef4444; --muted:#8a96a3; --line:#374151; --blue:#3b82f6; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:system-ui,-apple-system,sans-serif; }
  header { padding:10px 16px; display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:8px; border-bottom:1px solid var(--line); }
  h1 { font-size:18px; margin:0; }
  #status { font-size:13px; color:var(--muted); }
  .abas { display:flex; gap:6px; flex-wrap:wrap; }
  button, select, input { background:#1f2937; color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:9px 12px; font-size:14px; }
  button.ativo, button.primary { background:var(--ok); color:#06210f; border:none; font-weight:700; }
  button:disabled { opacity:.5; }
  main { display:grid; grid-template-columns: 1fr 1fr; gap:12px; padding:12px 16px; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }
  #mapa { height:62vh; min-height:340px; border-radius:10px; }
  @media (max-width: 860px) { #mapa { height:42vh; } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px; }
  #stage { position:relative; width:100%; background:#000; border-radius:8px; overflow:hidden; min-height:200px; }
  video, #canvas { width:100%; display:block; }
  #canvas { position:absolute; inset:0; height:100%; }
  .link { display:none; padding:8px 10px; border-radius:8px; font-weight:700; font-size:14px; margin-bottom:8px; }
  .link.ok { background:#14532d; color:#bbf7d0; }
  .link.warn { background:#713f12; color:#fef08a; }
  .link.off { background:#7f1d1d; color:#fecaca; }
  #recBadge { position:absolute; right:8px; top:8px; background:#ef4444; color:#fff; padding:4px 8px; border-radius:6px; font-size:13px; font-weight:700; display:none; }
  #camLabel { position:absolute; left:8px; top:8px; background:rgba(0,0,0,.6); padding:4px 8px; border-radius:6px; font-size:13px; }
  .painel { display:flex; flex-wrap:wrap; gap:14px; font-size:14px; margin:8px 0; }
  .alerta { padding:8px 10px; border-radius:8px; background:var(--alert); font-weight:700; display:none; margin:6px 0; }
  .controles { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .dica { font-size:12px; color:var(--muted); margin-top:6px; }
  .hidden { display:none !important; }
  .cam-pin { background:var(--blue); color:#fff; border:2px solid #fff; border-radius:50%; width:24px; height:24px; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; }
  .cam-pin.on { background:var(--ok); color:#06210f; transform:scale(1.25); }
  .leaflet-popup-content img { width:200px; border-radius:6px; display:block; }
</style>
</head>
<body>
<header>
  <h1>Anjo da Guarda <small style="font-size:12px;color:#8a96a3">v21</small></h1>
  <div class="abas">
    <button data-modo="sim" class="ativo">Simulação</button>
    <button data-modo="cel">Celular (câmera)</button>
    <button data-modo="central">Central (notebook)</button>
  </div>
  <span id="status">Carregando modelo de IA…</span>
</header>

<main>
  <div id="mapa"></div>

  <div class="card">
    <div id="link" class="link"></div>
    <div id="stage">
      <video id="video" playsinline muted autoplay></video>
      <canvas id="canvas"></canvas>
      <div id="camLabel">Sem câmera ativa</div>
      <div id="recBadge">● REC 00:00</div>
    </div>
    <div class="painel">
      <span>Pessoas: <b id="pessoas">0</b></span>
      <span>Veículos: <b id="veiculos">0</b></span>
      <span>Únicos: <b id="unicos">0 pessoas · 0 veículos</b></span>
      <span>Câmeras: <b id="ncams">0</b></span>
      <span>Percorrido: <b id="dist">0 m</b> <small id="parado" style="color:#8a96a3"></small></span>
      <span>GPS: <b id="gps">–</b></span>
      <span>FPS: <b id="fps">0</b></span>
    </div>
    <div id="alerta" class="alerta"></div>
    <div id="geoAlerta" class="alerta"></div>

    <!-- Simulação -->
    <div id="ctl-sim" class="controles">
      <select id="velocidade">
        <option value="1.4">A pé</option>
        <option value="5">Bike</option>
        <option value="12">Carro</option>
      </select>
      <button id="simIniciar" class="primary">Iniciar simulação</button>
      <button id="simParar">Parar</button>
      <button id="rotaDesenhar">Desenhar rota</button>
      <button id="rotaPadrao">Rota padrão</button>
    </div>

    <!-- Celular -->
    <div id="ctl-cel" class="controles hidden">
      <input id="codigoCel" placeholder="Código da central" value="paulo">
      <label class="dica" style="display:flex;align-items:center;gap:6px;margin:0">
        <input type="checkbox" id="microfone" checked> Microfone
      </label>
      <button id="celIniciar" class="primary">Iniciar e transmitir</button>
      <button id="celParar">Parar</button>
      <button id="gravarCentral">⏺ Gravar na central: não</button>
    </div>

    <!-- Central -->
    <div id="ctl-central" class="controles hidden">
      <input id="codigoCentral" placeholder="Código da central" value="paulo">
      <button id="centralAbrir" class="primary">Abrir central</button>
    </div>

    <div class="controles">
      <button id="seguir" class="ativo">Seguir: ligado</button>
      <button id="geoDesenhar">Desenhar área</button>
      <button id="geoLimpar">Limpar área</button>
      <button id="trocar">Trocar câmera</button>
      <button id="audioModo">🔊 Áudio: alertas e resumo</button>
      <button id="baixar">Baixar log (CSV)</button>
      <button id="baixarObj">Baixar objetos (CSV)</button>
      <button id="baixarGpx">Baixar percurso (GPX)</button>
    </div>
    <div class="controles">
      <button id="gravar">● Gravar</button>
      <label class="dica" style="display:flex;align-items:center;gap:6px;margin:0">
        <input type="checkbox" id="gravarAlertas" checked> Gravar automaticamente nos alertas
      </label>
      <button id="som" class="hidden">🔇 Som desligado</button>
      <span id="gravStatus" class="dica" style="margin:0"></span>
    </div>
    <div id="dica" class="dica"></div>
    <details class="dica" style="margin-top:10px">
      <summary>Configurar TURN (para transmitir pelo 4G)</summary>
      <div class="controles">
        <input id="turnUser" placeholder="Usuário (USERNAME)" autocomplete="off">
        <input id="turnPass" type="password" placeholder="Senha (PASSWORD)" autocomplete="off">
        <button id="turnSalvar">Salvar</button>
      </div>
      <div id="turnStatus">TURN: não configurado</div>
    </details>
  </div>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>window.L || document.write('<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"><script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"><\/script>');</script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
/* ===================== Configuração ===================== */
const CLASSES_INTERESSE = { person:"pessoa", bicycle:"bicicleta", car:"carro", motorcycle:"moto",
  bus:"ônibus", truck:"caminhão", knife:"faca", backpack:"mochila", handbag:"bolsa" };
const CLASSES_ALERTA = new Set(["knife"]);
const LIMIAR_PESSOAS = 8, LIMIAR_VEICULOS = 10, CONF = 0.4;
const ESPACO_CAMERAS = 50; // metros
const ROTA_PADRAO = [ // Ipanema – Rua Visconde de Pirajá
  [-22.98468,-43.19856],[-22.98430,-43.20280],[-22.98420,-43.20620],[-22.98450,-43.21000],[-22.98490,-43.21300]
];
const DICAS = {
  sim: "Simulação: o ponto percorre a rota no mapa, com câmeras a cada 50 m. A imagem vem da webcam (ou câmera do celular) e troca de câmera conforme o avanço.",
  cel: "Celular: abra a Central no notebook com o mesmo código, depois toque em Iniciar e caminhe. A cada 50 m o celular vira uma nova câmera.",
  central: "Central: clique em Abrir central e depois inicie o celular com o mesmo código. A imagem e a posição do celular aparecem aqui."
};

/* ===================== Elementos e estado ===================== */
const $ = id => document.getElementById(id);
const video = $("video"), canvas = $("canvas"), ctx = canvas.getContext("2d");
let modo = "sim", model = null, stream = null, detectando = false, facing = "environment";
let tPrev = performance.now(), ultimoLog = 0;
const log = [["timestamp","modo","lat","lng","camera","pessoas","veiculos","objetos","alertas","ids_visiveis"]];

let posAtual = null, camAtiva = null, percorrido = 0;
let cameras = []; // {id, lat, lng, marker, img}
let rota = ROTA_PADRAO.map(p => L.latLng(p[0], p[1]));
let simTimer = null, simDist = 0;
let desenhandoRota = false, desenhandoGeo = false;
let geoPontos = [], geoPoligono = null, dentroArea = true;
let peer = null, conn = null;

/* ===================== Mapa ===================== */
const mapa = L.map("mapa").setView([-22.9845, -43.2060], 16);
// Bases cartográficas gratuitas, com troca automática se uma falhar
const BASES = {
  "Ruas (Esri)": L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}",
    { maxZoom:19, attribution:"Tiles &copy; Esri" }),
  "Ruas (OpenStreetMap)": L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",
    { maxZoom:19, attribution:"&copy; OpenStreetMap" }),
  "Satélite (Esri)": L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
    { maxZoom:19, attribution:"Imagery &copy; Esri" })
};
const ordemBases = Object.values(BASES);
let baseAtual = 0, falhasBase = 0;
ordemBases[0].addTo(mapa);
L.control.layers(BASES, null, { position:"topright" }).addTo(mapa);
ordemBases.forEach((camada, i) => {
  camada.on("tileerror", () => {
    if (i !== baseAtual || ++falhasBase < 4 || baseAtual === ordemBases.length - 1) return;
    mapa.removeLayer(camada); baseAtual++; falhasBase = 0;
    ordemBases[baseAtual].addTo(mapa);
  });
  camada.on("load", () => { if (i === baseAtual) falhasBase = 0; });
});
mapa.on("baselayerchange", e => { baseAtual = ordemBases.indexOf(e.layer); falhasBase = 0; });
// Corrige mapa cinza/em branco no Safari quando a tela muda de tamanho
function ajustarMapa() { setTimeout(() => mapa.invalidateSize(), 250); }
window.addEventListener("resize", ajustarMapa);
window.addEventListener("orientationchange", ajustarMapa);
window.addEventListener("load", ajustarMapa);
let seguir = true;
const rotaLinha = L.polyline(rota, { color:"#3b82f6", weight:4, opacity:.6, dashArray:"6 6" }).addTo(mapa);
const trilha = L.polyline([], { color:"#22c55e", weight:5 }).addTo(mapa);
const usuario = L.circleMarker([0,0], { radius:9, color:"#fff", weight:3, fillColor:"#ef4444", fillOpacity:1 });

mapa.on("click", e => {
  if (desenhandoRota) {
    rota.push(e.latlng); rotaLinha.setLatLngs(rota);
  } else if (desenhandoGeo) {
    geoPontos.push(e.latlng);
    if (!geoPoligono) geoPoligono = L.polygon(geoPontos, { color:"#f59e0b", fillOpacity:.12 }).addTo(mapa);
    else geoPoligono.setLatLngs(geoPontos);
  }
});

function dist(a, b) { return L.latLng(a).distanceTo(L.latLng(b)); }

function dentroPoligono(p, poly) {
  let dentro = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const xi = poly[i].lng, yi = poly[i].lat, xj = poly[j].lng, yj = poly[j].lat;
    if (((yi > p.lat) !== (yj > p.lat)) && (p.lng < (xj - xi) * (p.lat - yi) / (yj - yi) + xi)) dentro = !dentro;
  }
  return dentro;
}

/* ===================== Câmeras ===================== */
function snapshot() {
  if (!video.videoWidth) return null;
  const c = document.createElement("canvas");
  c.width = 320; c.height = Math.round(320 * video.videoHeight / video.videoWidth);
  c.getContext("2d").drawImage(video, 0, 0, c.width, c.height);
  return c.toDataURL("image/jpeg", 0.6);
}

function criarCamera(lat, lng, img, idForcado) {
  const id = idForcado || cameras.length + 1;
  const icon = L.divIcon({ className:"", html:`<div class="cam-pin" id="pin${id}">${id}</div>`, iconSize:[24,24], iconAnchor:[12,12] });
  const marker = L.marker([lat, lng], { icon }).addTo(mapa);
  const cam = { id, lat, lng, marker, img };
  atualizarPopup(cam);
  cameras.push(cam);
  $("ncams").textContent = cameras.length;
  return cam;
}

function atualizarPopup(cam) {
  cam.marker.bindPopup(`<b>Câmera ${cam.id}</b><br>${cam.img ? `<img src="${cam.img}">` : "Sem imagem ainda"}`);
}

function ativarCamera(cam) {
  if (camAtiva === cam) return;
  if (camAtiva) document.getElementById("pin" + camAtiva.id)?.classList.remove("on");
  camAtiva = cam;
  document.getElementById("pin" + cam.id)?.classList.add("on");
  $("camLabel").textContent = `Câmera ${cam.id} · ao vivo`;
  if (typeof anunciarCamera === "function") anunciarCamera(cam.id);
}

function camMaisProxima(p) {
  let melhor = null, dMin = Infinity;
  for (const c of cameras) { const d = dist(p, [c.lat, c.lng]); if (d < dMin) { dMin = d; melhor = c; } }
  return { cam: melhor, d: dMin };
}

/* ===================== Posição (comum a todos os modos) ===================== */
/* Filtro de GPS: ignora a oscilação do sinal com o aparelho parado.
   Só conta deslocamento quando a mudança é maior que a margem de erro do GPS. */
const PRECISAO_MAX = 35;   // leituras com erro maior que 35 m são descartadas
const MOV_MIN = 8;         // deslocamento mínimo considerado (m)
function novaPosicao(lat, lng, origemCel = false, acc = null) {
  const p = L.latLng(lat, lng);
  if (acc !== null && acc > PRECISAO_MAX && posAtual) {
    $("gps").textContent = `fraco (±${Math.round(acc)} m)`; falar("GPS fraco.", 6, "gps", 120000); return;
  }
  if (acc !== null) $("gps").textContent = `±${Math.round(acc)} m`;
  if (posAtual) {
    const d = dist(posAtual, p);
    if (acc !== null) {   // só posições do GPS real (a simulação não passa pelo filtro)
      const limiar = Math.max(MOV_MIN, acc * 0.8);
      if (d < limiar) { $("parado").textContent = "parado"; return; }   // oscilação: não move
      $("parado").textContent = "em movimento";
    }
    percorrido += d;
  }
  posAtual = p;
  percurso.push({ lat, lng, t:new Date().toISOString(), cam:camAtiva?.id ?? "" });
  if (!mapa.hasLayer(usuario)) usuario.addTo(mapa);
  usuario.setLatLng(p);
  trilha.addLatLng(p);
  const pts = trilha.getLatLngs(); if (pts.length > 3000) trilha.setLatLngs(pts.slice(-2000));
  $("dist").textContent = `${Math.round(percorrido)} m`;
  if (seguir) mapa.setView(p, mapa.getZoom(), { animate:true });
  else if (!mapa.getBounds().pad(-0.2).contains(p)) mapa.panTo(p);

  // Celular: vira nova câmera a cada 50 m
  if (origemCel) {
    const ultima = cameras[cameras.length - 1];
    if (!ultima || dist(p, [ultima.lat, ultima.lng]) >= ESPACO_CAMERAS) {
      const cam = criarCamera(lat, lng, snapshot());
      enviar({ tipo:"cam", id:cam.id, lat, lng, img:cam.img });
    }
  }
  const { cam } = camMaisProxima(p);
  if (cam) ativarCamera(cam);

  // Geofence
  if (geoPontos.length >= 3) {
    const dentro = dentroPoligono(p, geoPontos);
    $("geoAlerta").style.display = dentro ? "none" : "block";
    $("geoAlerta").textContent = "ALERTA: fora da área delimitada";
    if (!dentro && dentroArea && navigator.vibrate) navigator.vibrate([200,100,200]);
    dentroArea = dentro;
    if (!dentro) aoAlerta(["FORA DA AREA"]);
  }
}

/* ===================== Câmera local ===================== */
async function abrirCameraLocal() {
  pararStream();
  const videoCfg = { facingMode: facing, width:{ ideal:1280 }, height:{ ideal:720 } };
  const querAudio = modo === "cel" && $("microfone").checked;
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: videoCfg,
      audio: querAudio ? { echoCancellation:true, noiseSuppression:true, autoGainControl:true } : false
    });
  } catch (e) {
    if (!querAudio) { $("status").textContent = "Sem acesso à câmera: " + e.message; return false; }
    // microfone negado ou indisponível: segue só com a câmera
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: videoCfg, audio:false });
      $("status").textContent = "Microfone indisponível — transmitindo só imagem";
    } catch (e2) { $("status").textContent = "Sem acesso à câmera: " + e2.message; return false; }
  }
  video.srcObject = stream;
  await video.play().catch(() => {});
  iniciarDeteccao();
  return true;
}

function pararStream() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null;
}

/* ===================== Detecção ===================== */
function iniciarDeteccao() {
  if (detectando || !model) return;
  detectando = true;
  loop();
}

async function loop() {
  if (!detectando) return;
  if (video.readyState < 2 || !video.videoWidth) { setTimeout(loop, 250); return; }
  const inicioQuadro = performance.now();
  if (canvas.width !== video.videoWidth) { canvas.width = video.videoWidth; canvas.height = video.videoHeight; }

  const preds = await model.detect(video, 20, CONF);
  const tAgora = performance.now();
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const contagem = {};
  const dets = [];
  for (const p of preds) {
    if (!(p.class in CLASSES_INTERESSE)) continue;
    contagem[p.class] = (contagem[p.class] || 0) + 1;
    // descarta objetos muito pequenos (distantes) e de baixa confiança — reduz contagem falsa
    if (p.bbox[3] < video.videoHeight * ALTURA_MIN) continue;
    if (p.score < (p.class === "person" ? 0.45 : 0.5)) continue;
    dets.push({ classe:p.class, bbox:p.bbox, score:p.score });
  }
  atualizarRastreamento(dets, tAgora);

  // Desenha só os objetos vistos neste quadro, com o ID de cada um
  for (const t of tracks) {
    if (t.ultimo !== tAgora) continue;
    const [x, y, w, h] = t.bbox;
    const cor = CLASSES_ALERTA.has(t.classe) ? "#ef4444" : t.suspeito ? "#f97316" : (t.id ? "#22c55e" : "#9ca3af");
    ctx.strokeStyle = cor; ctx.lineWidth = 3; ctx.strokeRect(x, y, w, h);
    const rotulo = `${CLASSES_INTERESSE[t.classe]} ${t.id ? "#" + t.id : "…"}${t.suspeito ? " · " + t.suspeito : ""}`;
    ctx.font = "16px system-ui";
    const tw = ctx.measureText(rotulo).width + 8;
    ctx.fillStyle = cor; ctx.fillRect(x, Math.max(y - 20, 0), tw, 20);
    ctx.fillStyle = "#000"; ctx.fillText(rotulo, x + 4, Math.max(y - 5, 15));
  }
  const pessoas = contagem.person || 0;
  const veiculos = ["car","motorcycle","bus","truck"].reduce((s, c) => s + (contagem[c] || 0), 0);
  const alertas = [];
  if ([...CLASSES_ALERTA].some(c => contagem[c])) alertas.push("OBJETO PERIGOSO");
  if (pessoas >= LIMIAR_PESSOAS) alertas.push("AGLOMERAÇÃO");
  if (veiculos >= LIMIAR_VEICULOS) alertas.push("ENGARRAFAMENTO");
  const comps = analisarComportamentos(tAgora);
  [...new Set(comps.map(c => c.tipo))].forEach(t => alertas.push(t));

  const agora = performance.now();
  $("fps").textContent = (1000 / Math.max(agora - tPrev, 1)).toFixed(1);
  tPrev = agora;
  $("pessoas").textContent = pessoas;
  $("veiculos").textContent = veiculos;
  if (alertas.length) aoAlerta(alertas);
  try { narrar(alertas, contagem, tAgora); } catch (e) { console.log("narração", e); }
  $("alerta").style.display = alertas.length ? "block" : "none";
  const soAtencao = alertas.length && alertas.every(x => ["PERMANÊNCIA PROLONGADA","CORRIDA","MOTO COM GARUPA","ENGARRAFAMENTO","PEDESTRES ATRAVESSANDO"].includes(x));
  $("alerta").style.background = soAtencao ? "#a16207" : "";
  $("alerta").textContent = "ALERTA: " + alertas.join(" | ") + (camAtiva ? ` (Câmera ${camAtiva.id})` : "");
  if (alertas.length && camAtiva) {
    const pin = document.getElementById("pin" + camAtiva.id);
    if (pin) pin.style.background = "#ef4444";
  } else if (camAtiva) {
    const pin = document.getElementById("pin" + camAtiva.id);
    if (pin) pin.style.background = "";
  }

  if (alertas.length || agora - ultimoLog >= 1000) {
    const idsVisiveis = tracks.filter(t => t.id && t.ultimo === tAgora).map(t => t.id).join(";");
    log.push([new Date().toISOString(), modo, posAtual?.lat?.toFixed(6) ?? "", posAtual?.lng?.toFixed(6) ?? "",
      camAtiva?.id ?? "", pessoas, veiculos,
      Object.entries(contagem).map(([k, v]) => `${k}=${v}`).join(";"), alertas.join(";"), idsVisiveis]);
    ultimoLog = agora;
  }

/* ===================== Comportamentos suspeitos ===================== */
// Baseados SOMENTE em movimento e posição — nunca em aparência (roupa, pele, idade etc.).
// Medidas relativas à altura da pessoa na imagem, para valer perto ou longe da câmera.
const COMP = {
  PERMANENCIA_S: 90,       // parado no mesmo ponto por mais de 90 s
  PERMANENCIA_DESL: 1.0,   // deslocamento máx. (em alturas de corpo) nos últimos 30 s
  CORRIDA_VEL: 2.0,        // alturas de corpo por segundo
  SUBITA_NOVOS: 5,         // pessoas novas em 8 s
  SUBITA_TOTAL: 6,
  CERCO_PESSOAS: 3,        // pessoas que se aproximam de uma mesma pessoa
  CAIDA_RAZAO: 1.3,        // largura/altura da caixa
  CAIDA_S: 3,
  GARUPA_S: 10,
  TRAVESSIA_LARGURA: 0.25, // pessoa cruza ao menos 25% da largura da imagem
  TRAVESSIA_PESSOAS: 3,     // 3 ou mais travessias...
  TRAVESSIA_JANELA_S: 20    // ...em 20 segundos
};
const COMP_VERMELHOS = new Set(["CORRERIA", "AGLOMERAÇÃO SÚBITA", "CERCO", "PESSOA CAÍDA"]);
let compAtivos = [], travessias = [];

function cameraParada() {
  // com a câmera andando (celular em movimento), velocidades na imagem não são confiáveis
  return modo === "sim" || $("parado").textContent !== "em movimento";
}
function velocidade(t, janelaMs, agora) {
  const h = t.hist.filter(p => agora - p.t <= janelaMs);
  if (h.length < 3) return 0;
  const a = h[0], b = h[h.length - 1], dt = (b.t - a.t) / 1000;
  if (dt < 0.8) return 0;
  const alt = h.reduce((s, p) => s + p.h, 0) / h.length;
  return Math.hypot(b.cx - a.cx, b.cy - a.cy) / alt / dt;
}
function posEm(t, momento) {   // posição mais próxima de um instante passado
  let melhor = null;
  for (const p of t.hist) if (p.t <= momento) melhor = p;
  return melhor;
}

function analisarComportamentos(agora) {
  const achados = [];
  const pessoas = tracks.filter(t => t.classe === "person" && t.id && agora - t.ultimo < 500);
  const parada = cameraParada();
  pessoas.forEach(t => t.suspeito = null);

  // 1. Permanência prolongada
  if (parada) pessoas.forEach(t => {
    if ((agora - t.primeiro) / 1000 < COMP.PERMANENCIA_S) return;
    const ant = posEm(t, agora - 30000), at = t.hist[t.hist.length - 1];
    if (ant && at && Math.hypot(at.cx - ant.cx, at.cy - ant.cy) / at.h < COMP.PERMANENCIA_DESL) {
      t.suspeito = "permanência"; achados.push({ tipo:"PERMANÊNCIA PROLONGADA", id:t.id });
    }
  });

  // 2. Corrida / correria
  if (parada) {
    const correndo = pessoas.filter(t => velocidade(t, 1500, agora) > COMP.CORRIDA_VEL);
    correndo.forEach(t => t.suspeito = "corrida");
    if (correndo.length >= 2) achados.push({ tipo:"CORRERIA", ids:correndo.map(t => t.id) });
    else if (correndo.length === 1) achados.push({ tipo:"CORRIDA", id:correndo[0].id });
  }

  // 3. Aglomeração súbita (padrão de arrastão)
  const novos = pessoas.filter(t => agora - t.primeiro < 8000);
  if (novos.length >= COMP.SUBITA_NOVOS && pessoas.length >= COMP.SUBITA_TOTAL) {
    novos.forEach(t => t.suspeito = "aglomeração súbita");
    achados.push({ tipo:"AGLOMERAÇÃO SÚBITA", ids:novos.map(t => t.id) });
  }

  // 4. Cerco: várias pessoas convergindo rapidamente para a mesma pessoa
  pessoas.forEach(alvo => {
    const at = alvo.hist[alvo.hist.length - 1]; if (!at) return;
    const cercando = pessoas.filter(o => {
      if (o === alvo) return false;
      const oa = o.hist[o.hist.length - 1], oAnt = posEm(o, agora - 5000), alvoAnt = posEm(alvo, agora - 5000);
      if (!oa || !oAnt || !alvoAnt) return false;
      const dAgora = Math.hypot(oa.cx - at.cx, oa.cy - at.cy) / at.h;
      const dAntes = Math.hypot(oAnt.cx - alvoAnt.cx, oAnt.cy - alvoAnt.cy) / alvoAnt.h;
      return dAgora < 1.2 && dAntes > 2.0;
    });
    if (cercando.length >= COMP.CERCO_PESSOAS) {
      alvo.suspeito = "cercado"; cercando.forEach(o => o.suspeito = "cerco");
      achados.push({ tipo:"CERCO", id:alvo.id, ids:cercando.map(o => o.id) });
    }
  });

  // 5. Pessoa caída
  pessoas.forEach(t => {
    const deitada = t.bbox[2] > t.bbox[3] * COMP.CAIDA_RAZAO;
    if (deitada) { t.caidaDesde = t.caidaDesde || agora; } else t.caidaDesde = null;
    if (t.caidaDesde && (agora - t.caidaDesde) / 1000 > COMP.CAIDA_S) {
      t.suspeito = "caída"; achados.push({ tipo:"PESSOA CAÍDA", id:t.id });
    }
  });

  // 6. Moto com garupa parada ou devagar
  tracks.filter(t => t.classe === "motorcycle" && t.id && agora - t.ultimo < 500).forEach(m => {
    const [mx] = centro(m.bbox);
    const sobre = pessoas.filter(p => {
      const [px, py] = centro(p.bbox);
      return Math.abs(px - mx) < m.bbox[2] * 0.6 && py < m.bbox[1] + m.bbox[3] && py > m.bbox[1] - p.bbox[3];
    });
    const lenta = !parada ? false : velocidade(m, 3000, agora) < 0.3;
    if (sobre.length >= 2 && lenta) { m.garupaDesde = m.garupaDesde || agora; } else m.garupaDesde = null;
    if (m.garupaDesde && (agora - m.garupaDesde) / 1000 > COMP.GARUPA_S) {
      m.suspeito = "garupa"; sobre.forEach(p => p.suspeito = "garupa");
      achados.push({ tipo:"MOTO COM GARUPA", id:m.id });
    }
  });

  // 7. Pedestres atravessando no trecho (deslocamento lateral pela imagem)
  if (parada && video.videoWidth) {
    pessoas.forEach(t => {
      if (t.atravessou) return;
      const h = t.hist.filter(q => agora - q.t <= 8000);
      if (h.length < 3) return;
      const dx = h[h.length - 1].cx - h[0].cx, dy = h[h.length - 1].cy - h[0].cy;
      if (Math.abs(dx) >= video.videoWidth * COMP.TRAVESSIA_LARGURA && Math.abs(dx) > 2 * Math.abs(dy)) {
        t.atravessou = true; travessias.push(agora);
      }
    });
  }
  while (travessias.length && agora - travessias[0] > COMP.TRAVESSIA_JANELA_S * 1000) travessias.shift();
  if (travessias.length >= COMP.TRAVESSIA_PESSOAS) achados.push({ tipo:"PEDESTRES ATRAVESSANDO", n:travessias.length });

  compAtivos = achados;
  return achados;
}


/* ===================== Áudio: narração em português ===================== */
// Prioridades: 1 alerta grave · 2 alerta de atenção · 3 troca de câmera · 4 mudança no ambiente
//              5 resumo periódico · 6 estado do sistema. Cada tipo tem intervalo mínimo para não repetir.
const MODOS_AUDIO = ["silencioso", "alertas", "resumo", "detalhado"];
const ROTULO_AUDIO = { silencioso:"🔇 Áudio: silencioso", alertas:"🔊 Áudio: só alertas", resumo:"🔊 Áudio: alertas e resumo", detalhado:"🔊 Áudio: detalhado" };
let modoAudio = (() => { try { return localStorage.getItem("modoAudio") || "resumo"; } catch { return "resumo"; } })();

let camAnunciar = null, histPessoas = [], ruaVaziaDesde = null;
const FALA_ALERTA = {
  "OBJETO PERIGOSO":[1,"Atenção! Objeto perigoso detectado"], "AGLOMERAÇÃO":[1,"Atenção! Aglomeração"],
  "CORRERIA":[1,"Atenção! Correria detectada"], "AGLOMERAÇÃO SÚBITA":[1,"Atenção! Aglomeração súbita"],
  "CERCO":[1,"Atenção! Pessoa sendo cercada"], "PESSOA CAÍDA":[1,"Atenção! Pessoa caída"],
  "FORA DA AREA":[1,"Atenção! Você saiu da área delimitada"],
  "CORRIDA":[2,"Pessoa correndo"], "PERMANÊNCIA PROLONGADA":[2,"Pessoa parada há mais de um minuto e meio"],
  "MOTO COM GARUPA":[2,"Moto com garupa parada"], "ENGARRAFAMENTO":[2,"Trânsito intenso"],
  "PEDESTRES ATRAVESSANDO":[2,"Pedestres atravessando{onde} Reduza a velocidade."]
};
function emMovimentoRapido() {
  const v = modo === "sim" ? parseFloat($("velocidade").value) : velUsuario;
  return v > 8;   // acima de ~29 km/h: modo carro, só alertas e frases curtas
}
function escolherVoz() {
  if (!("speechSynthesis" in window)) return;
  const vs = speechSynthesis.getVoices();
  vozPt = vs.find(v => /pt[-_]BR/i.test(v.lang)) || vs.find(v => /^pt/i.test(v.lang)) || null;
}
if ("speechSynthesis" in window) { escolherVoz(); speechSynthesis.onvoiceschanged = escolherVoz; }
function liberarAudio() {   // iPhone: o áudio só funciona depois de um toque na tela

}
function falar(texto, prioridade, chave, intervalo) {
  if (modoAudio === "silencioso" || !("speechSynthesis" in window)) return false;
  if (modoAudio === "alertas" && prioridade >= 3 && prioridade !== 6) return false;
  if (emMovimentoRapido() && (prioridade === 4 || prioridade === 5)) return false;
  const agora = performance.now();
  if (chave && agora - (ultimoPorChave[chave] ?? -1e9) < intervalo) return false;
  if (prioridade > 1 && speechSynthesis.speaking && prioridade >= falando) return false;

  try { speechSynthesis.speak(u); } catch (e) { console.log("áudio indisponível", e); return false; }

const plural = (n, um, varios, nenhum) => n === 0 && nenhum ? nenhum : `${n} ${n === 1 ? um : varios}`;
function descreverContagem(c, detalhado) {
  const p = c.person || 0, carros = c.car || 0, motos = c.motorcycle || 0, bikes = c.bicycle || 0;
  const pesados = (c.bus || 0) + (c.truck || 0);
  const partes = [plural(p, "pessoa", "pessoas", "nenhuma pessoa"), plural(carros, "carro", "carros", "nenhum carro")];
  if (motos) partes.push(plural(motos, "moto", "motos"));
  if (bikes) partes.push(plural(bikes, "bicicleta", "bicicletas"));
  if (detalhado && pesados) partes.push(plural(pesados, "ônibus ou caminhão", "ônibus ou caminhões"));

}
function anunciarCamera(id) { camAnunciar = { id, em: performance.now() + 1500 }; }   // espera a imagem nova
function narrar(alertas, contagem, agora) {
  // 1 e 2: alertas
  for (const a of alertas) {
    const [pri, frase] = FALA_ALERTA[a] || [2, "Atenção: " + a.toLowerCase()];
    const onde = camAtiva ? ` na câmera ${camAtiva.id}.` : ".";
    falar(frase.includes("{onde}") ? frase.replace("{onde}", onde) : frase + onde, pri, "alerta-" + a, pri === 1 ? 30000 : 60000);
  }
  if (alertas.length) return;
  const p = contagem.person || 0;
  const veic = ["car","motorcycle","bus","truck"].reduce((s, k) => s + (contagem[k] || 0), 0);
  // 3: troca de câmera
  if (camAnunciar && agora >= camAnunciar.em) {
    const det = modoAudio === "detalhado";
    const txt = emMovimentoRapido() ? `Câmera ${camAnunciar.id}.` : `Câmera ${camAnunciar.id}. ${descreverContagem(contagem, det)}. Movimento normal.`;
    falar(txt, 3, "camera-" + camAnunciar.id, 20000); camAnunciar = null; return;
  }

  histPessoas.push({ t:agora, p }); while (histPessoas.length && agora - histPessoas[0].t > 20000) histPessoas.shift();

/* ===================== Gravação (central) ===================== */
// Grava o vídeo com as caixas de detecção, IDs, data/hora e câmera impressos na imagem.

const MAX_ALERTA_MS = 60 * 1000;        // gravação de alerta dura no máximo 60 s
const PAUSA_ALERTA_MS = 30 * 1000;      // depois, espera 30 s antes de gravar outro alerta
const ALERTAS_QUE_GRAVAM = new Set(["OBJETO PERIGOSO", "AGLOMERAÇÃO", "FORA DA AREA"]); // engarrafamento só vai para o log
let fimUltimoAlertaGrav = -1e9;
COMP_VERMELHOS.forEach(a => ALERTAS_QUE_GRAVAM.add(a));
let gravando = false, gravador = null, pedacos = [], motivoGrav = "", inicioGrav = 0;

function tipoVideo(comAudio) {

function desenharComposicao() {

  const W = compCanvas.width, H = compCanvas.height;

  const fs = Math.max(14, Math.round(H / 32));

  compCtx.fillStyle = "rgba(0,0,0,.6)"; compCtx.fillRect(0, H - fs - 14, tw, fs + 14);

function iniciarGravacao(motivo) {

}

function salvarGravacao(meta) {

function aoAlerta(alertas) {

/* ===================== Rastreamento: um ID por objeto ===================== */
const CONFIRMA_QUADROS = 5;   // precisa aparecer em 5 análises (~0,6 s) para ganhar ID
const PERDA_MS = 2000;        // some por mais de 2 s = sai da tela (mas pode ser reidentificado)
const REID_MS = 6000;         // reaparece em até 6 s perto de onde sumiu = mesmo ID
const ALTURA_MIN = 0.05;      // ignora objetos com menos de 5% da altura da imagem
const HIST_MS = 35000;        // histórico de posições para análise de comportamento
let tracks = [], perdidos = [], proxId = 1, unicos = {};
const objetosLog = [["id","classe","primeira_vez","ultima_vez","segundos_visivel","camera","lat","lng"]];

const centro = b => [b[0] + b[2] / 2, b[1] + b[3] / 2];

function iou(a, b) {
  const x1 = Math.max(a[0], b[0]), y1 = Math.max(a[1], b[1]);
  const x2 = Math.min(a[0] + a[2], b[0] + b[2]), y2 = Math.min(a[1] + a[3], b[1] + b[3]);
  const inter = Math.max(0, x2 - x1) * Math.max(0, y2 - y1);
  return inter / (a[2] * a[3] + b[2] * b[3] - inter || 1);
}

// posição prevista pela velocidade recente (ajuda quando a câmera ou o objeto se movem)
function prever(t, agora) {
  const dt = Math.min((agora - t.ultimo) / 1000, 1.5);
  const [vx, vy] = t.vel || [0, 0];
  return [t.bbox[0] + vx * dt, t.bbox[1] + vy * dt, t.bbox[2], t.bbox[3]];
}

function semelhanca(t, d, agora) {
  if (t.classe !== d.classe) return 0;
  const pb = prever(t, agora);
  const v = iou(pb, d.bbox);
  if (v > 0.15) return v;
  const [ax, ay] = centro(pb), [bx, by] = centro(d.bbox);
  const escala = Math.sqrt(pb[2] * pb[3]);
  const razao = (d.bbox[2] * d.bbox[3]) / (pb[2] * pb[3] || 1);
  if (razao < 0.4 || razao > 2.5) return 0;
  // raio de busca: maior para objetos ainda sem velocidade conhecida (ex.: alguém que começa a correr)
  const raio = t.vel ? Math.max(0.7 * escala, 0.8 * pb[3]) : Math.max(0.9 * escala, 1.1 * pb[3]);
  return Math.hypot(ax - bx, ay - by) < raio ? 0.1 : 0;
}

function atualizarTrack(t, d, agora) {
  const [cx0, cy0] = centro(t.bbox), [cx1, cy1] = centro(d.bbox);
  const dt = Math.max((agora - t.ultimo) / 1000, 0.05);
  const vNova = [(cx1 - cx0) / dt, (cy1 - cy0) / dt];
  t.vel = t.vel ? [t.vel[0] * 0.6 + vNova[0] * 0.4, t.vel[1] * 0.6 + vNova[1] * 0.4] : vNova;
  t.bbox = d.bbox; t.ultimo = agora; t.ultimoISO = new Date().toISOString(); t.quadros++;
  t.scoreSoma = (t.scoreSoma || 0) + d.score;
  const ult = t.hist[t.hist.length - 1];
  if (!ult || agora - ult.t >= 250) t.hist.push({ t:agora, cx:cx1, cy:cy1, w:d.bbox[2], h:d.bbox[3] });
  while (t.hist.length && agora - t.hist[0].t > HIST_MS) t.hist.shift();
  if (!t.id && t.quadros >= CONFIRMA_QUADROS && t.scoreSoma / t.quadros >= 0.5) confirmar(t);
}

function atualizarRastreamento(dets, agora) {
  const pares = [];
  tracks.forEach((t, ti) => dets.forEach((d, di) => {
    const sc = semelhanca(t, d, agora); if (sc > 0) pares.push([sc, ti, di]);
  }));
  pares.sort((a, b) => b[0] - a[0]);
  const tUsado = new Set(), dUsado = new Set();
  for (const [, ti, di] of pares) {
    if (tUsado.has(ti) || dUsado.has(di)) continue;
    tUsado.add(ti); dUsado.add(di);
    atualizarTrack(tracks[ti], dets[di], agora);
  }
  dets.forEach((d, di) => {
    if (dUsado.has(di)) return;
    // reidentificação: objeto que sumiu há pouco perto daqui recupera o mesmo ID
    let melhor = -1, melhorS = 0;
    perdidos.forEach((t, k) => { const sc = semelhanca(t, d, agora); if (sc > melhorS) { melhorS = sc; melhor = k; } });
    if (melhor >= 0) {
      const t = perdidos.splice(melhor, 1)[0];
      atualizarTrack(t, d, agora); tracks.push(t); return;
    }
    const [cx, cy] = centro(d.bbox);
    tracks.push({ classe:d.classe, bbox:d.bbox, quadros:1, id:null, scoreSoma:d.score, vel:null,
      hist:[{ t:agora, cx, cy, w:d.bbox[2], h:d.bbox[3] }],
      primeiro:agora, ultimo:agora, primeiroISO:new Date().toISOString(), ultimoISO:new Date().toISOString(),
      camera:camAtiva?.id ?? "", lat:posAtual?.lat, lng:posAtual?.lng });
  });
  tracks = tracks.filter(t => {
    if (agora - t.ultimo <= PERDA_MS) return true;
    if (t.id) perdidos.push(t);   // guarda para possível reidentificação
    return false;
  });
  perdidos = perdidos.filter(t => {
    if (agora - t.ultimo <= REID_MS) return true;
    registrarObjeto(t);
    return false;
  });
}

function confirmar(t) {
  t.id = proxId++;
  unicos[t.classe] = (unicos[t.classe] || 0) + 1;
  const up = unicos.person || 0;
  const uv = ["car","motorcycle","bus","truck"].reduce((s, c) => s + (unicos[c] || 0), 0);
  $("unicos").textContent = `${up} pessoas · ${uv} veículos`;
}

function registrarObjeto(t) {
  objetosLog.push([t.id, CLASSES_INTERESSE[t.classe], t.primeiroISO, t.ultimoISO,
    ((t.ultimo - t.primeiro) / 1000).toFixed(1), t.camera,
    t.lat?.toFixed(6) ?? "", t.lng?.toFixed(6) ?? ""]);
}

function resetRastreamento() {
  tracks = []; perdidos = []; proxId = 1; unicos = {};
  objetosLog.length = 1;
  $("unicos").textContent = "0 pessoas · 0 veículos";
}

/* ===================== Modo Simulação ===================== */
function pontoNaRota(d) {
  let acum = 0;
  for (let i = 1; i < rota.length; i++) {
    const seg = rota[i - 1].distanceTo(rota[i]);
    if (acum + seg >= d) {
      const f = (d - acum) / seg;
      return L.latLng(rota[i-1].lat + (rota[i].lat - rota[i-1].lat) * f, rota[i-1].lng + (rota[i].lng - rota[i-1].lng) * f);
    }
    acum += seg;
  }
  return null;
}

function comprimentoRota() {
  let t = 0; for (let i = 1; i < rota.length; i++) t += rota[i-1].distanceTo(rota[i]); return t;
}

function prepararCamerasRota() {
  limparCameras();
  const total = comprimentoRota();
  for (let d = 0; d <= total; d += ESPACO_CAMERAS) {
    const p = pontoNaRota(d); if (p) criarCamera(p.lat, p.lng, null);
  }
}

async function iniciarSimulacao() {
  if (rota.length < 2) { $("status").textContent = "Desenhe uma rota com pelo menos 2 pontos"; return; }
  pararSimulacao();
  desenhandoRota = false; $("rotaDesenhar").classList.remove("ativo");
  resetTrajeto();
  prepararCamerasRota();
  mapa.fitBounds(rotaLinha.getBounds().pad(0.2));
  if (!stream) await abrirCameraLocal();
  $("status").textContent = "Simulando trajeto…";
  simDist = 0;
  const passoMs = 500;
  simTimer = setInterval(() => {
    const vel = parseFloat($("velocidade").value);
    simDist += vel * passoMs / 1000;
    const p = pontoNaRota(simDist);
    if (!p) { pararSimulacao(); $("status").textContent = "Simulação concluída"; return; }
    novaPosicao(p.lat, p.lng);
    if (camAtiva && !camAtiva.img) { camAtiva.img = snapshot(); atualizarPopup(camAtiva); }
  }, passoMs);
}

function pararSimulacao() { if (simTimer) clearInterval(simTimer); simTimer = null; }

/* ===================== Modo Celular ===================== */
let watchId = null;
async function iniciarCelular() {
  const codigo = $("codigoCel").value.trim();
  if (!codigo) return;
  resetTrajeto(); limparCameras();
  if (!await abrirCameraLocal()) return;

  if (!navigator.geolocation) { $("status").textContent = "GPS indisponível neste aparelho"; return; }
  watchId = navigator.geolocation.watchPosition(
    pos => {
      const { latitude:lat, longitude:lng, accuracy, speed } = pos.coords;
      if (!posAtual) mapa.setView([lat, lng], 17);
      velUsuario = (speed ?? -1) >= 0 ? speed : velUsuario;
      novaPosicao(lat, lng, true, accuracy);
      enviar({ tipo:"pos", lat, lng, acc:accuracy, spd:velUsuario });
    },
    e => $("status").textContent = "Erro de GPS: " + e.message,
    { enableHighAccuracy:true, maximumAge:1000, timeout:15000 }
  );

  transmitindo = true;
  codigoAtual = codigo;
  manterTelaAcesa();
  conectarCentral();
  $("status").textContent = "Câmera e GPS ativos — conectando à central…";
}

/* Conexão com a central (usada no início e na reconexão automática) */
let transmitindo = false, codigoAtual = "", chamadaAtual = null, wakeLock = null;
let ultimaReconexao = -1e9, tentativas = 0;
async function reconectar() {
  if (!transmitindo) return;
  ultimaReconexao = performance.now(); tentativas++;
  $("status").textContent = `Reconectando à central… (tentativa ${tentativas})`;
  const cameraParada = !stream || stream.getVideoTracks().every(t => t.readyState === "ended");
  if (cameraParada && !await abrirCameraLocal()) return;
  try { conn?.close(); } catch {}
  conn = null;
  // a cada 3 tentativas, recria toda a conexão (necessário após troca Wi-Fi ↔ 4G)
  if (tentativas % 3 === 0 && peer) { try { peer.destroy(); } catch {} peer = null; }
  conectarCentral();
}
function ligarParaCentral(p) {
  const idCentral = "anjo-guarda-" + codigoAtual;
  if (chamadaAtual) { try { chamadaAtual.close(); } catch {} }
  chamadaAtual = p.call(idCentral, stream);
  chamadaAtual?.peerConnection?.addEventListener("iceconnectionstatechange", () => {
    const st = chamadaAtual.peerConnection.iceConnectionState;
    if (st === "failed" || st === "disconnected") {
      $("status").textContent = "Conexão de vídeo caiu — reconectando…";
      if (transmitindo && performance.now() - ultimaReconexao > 4000) reconectar();
    }
  });
  if (!conn || !conn.open) {
    conn = p.connect(idCentral, { reliable:true });
    conn.on("open", () => { $("status").textContent = "Transmitindo para a central"; if (gravarNaCentral) enviar({ tipo:"gravar", ligar:true }); });
    conn.on("data", d => {
      if (d.tipo === "geo") definirGeo(d.pontos);
      if (d.tipo === "ack") { ultimoAck = performance.now(); ackInfo = d; if (d.recebendo) tentativas = 0; }
    });
    conn.on("close", () => { if (transmitindo) $("status").textContent = "Central desconectada"; });
  }
}
function conectarCentral() {
  if (peer && !peer.destroyed && !peer.disconnected) { ligarParaCentral(peer); return; }
  if (peer && peer.disconnected && !peer.destroyed) { peer.reconnect(); peer.once("open", () => ligarParaCentral(peer)); return; }
  conectarPeer(null, p => ligarParaCentral(p));
}

/* Tela sempre acesa enquanto transmite (Safari 16.4+) */
async function manterTelaAcesa() {
  try { if ("wakeLock" in navigator && document.visibilityState === "visible") wakeLock = await navigator.wakeLock.request("screen"); }
  catch {}
}

/* Segundo plano: o iOS desliga a câmera; ao voltar, religa e reconecta sozinho */
document.addEventListener("visibilitychange", async () => {
  if (modo !== "cel" || !transmitindo) return;
  if (document.visibilityState === "hidden") {
    enviar({ tipo:"pausa" });
    return;
  }
  $("status").textContent = "De volta — religando câmera…";
  manterTelaAcesa();
  const cameraParada = !stream || stream.getVideoTracks().every(t => t.readyState === "ended" || t.muted);
  if (cameraParada) { if (!await abrirCameraLocal()) return; }
  conectarCentral();
  enviar({ tipo:"retomada" });
});

function pararCelular() {
  transmitindo = false;
  if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
  if (chamadaAtual) { try { chamadaAtual.close(); } catch {} chamadaAtual = null; }
  if (watchId !== null) navigator.geolocation.clearWatch(watchId);
  watchId = null;
  pararStream();
  if (peer) peer.destroy(); peer = null; conn = null;
  $("status").textContent = "Parado";
}

/* ===================== Modo Central ===================== */
function abrirCentral() {
  const codigo = $("codigoCentral").value.trim();
  if (!codigo) return;
  resetTrajeto(); limparCameras();
  conectarPeer("anjo-guarda-" + codigo, p => {
    $("status").textContent = `Central aberta (código: ${codigo}) — aguardando celular`;
    p.on("call", call => {
      chamadaCentral = call; statsAnt = null;
      call.answer();
      call.on("stream", s => {
        video.srcObject = s; video.muted = !somCentral; video.play().catch(() => {});
        if (gravacaoRemotaAtiva && !gravando) setTimeout(() => gravacaoRemota(true), 1500);
        $("som").classList.toggle("hidden", !s.getAudioTracks().length);
        $("status").textContent = "Recebendo imagem do celular";
        iniciarDeteccao();
      });
    });
    p.on("connection", c => {
      conn = c;
      c.on("open", () => { if (geoPontos.length >= 3) enviar({ tipo:"geo", pontos:geoPontos.map(q => [q.lat, q.lng]) }); });
      c.on("data", d => {
        ultimoHb = performance.now();
        if (d.tipo === "pos") { if (d.spd != null) velUsuario = d.spd; novaPosicao(d.lat, d.lng, false, d.acc ?? null); }
        if (d.tipo === "pausa") $("status").textContent = "Celular em segundo plano — transmissão pausada";
        if (d.tipo === "gravar") gravacaoRemota(d.ligar);
        if (d.tipo === "retomada") $("status").textContent = "Celular voltou — reconectando imagem…";
        if (d.tipo === "cam") { criarCamera(d.lat, d.lng, d.img, d.id); if (posAtual) ativarCamera(camMaisProxima(posAtual).cam); }
      });
      c.on("close", () => $("status").textContent = "Celular desconectado");
    });
  });
}

/* ===================== Comunicação (PeerJS) ===================== */
/* TURN (retransmissão) — necessário quando o celular está no 4G/5G.
   Credencial gratuita do Metered (usuário e senha), salva só neste aparelho. */
function lerCfg(k) { try { return localStorage.getItem(k) || ""; } catch { return ""; } }
function salvarCfg(k, v) { try { localStorage.setItem(k, v); } catch {} }

async function iceServers() {
  const base = [{ urls:"stun:stun.l.google.com:19302" }, { urls:"stun:stun.relay.metered.ca:80" }];
  const user = lerCfg("turnUser").trim(), pass = lerCfg("turnPass").trim();
  if (!user || !pass) { $("turnStatus").textContent = "TURN: não configurado (só funciona no mesmo Wi-Fi)"; return base; }
  $("turnStatus").textContent = "TURN: ativo";
  const h = "global.relay.metered.ca";
  return base.concat([
    { urls:`turn:${h}:80`, username:user, credential:pass },
    { urls:`turn:${h}:80?transport=tcp`, username:user, credential:pass },
    { urls:`turn:${h}:443`, username:user, credential:pass },
    { urls:`turns:${h}:443?transport=tcp`, username:user, credential:pass }
  ]);
}

async function conectarPeer(id, aoAbrir) {
  if (peer) peer.destroy();
  const config = { iceServers: await iceServers() };
  peer = id ? new Peer(id, { config }) : new Peer({ config });
  peer.on("open", () => aoAbrir(peer));
  const este = peer;
  peer.on("disconnected", () => {   // perdeu o servidor de sinalização (rede oscilou)
    setTimeout(() => { if (este === peer && !este.destroyed && este.disconnected) { try { este.reconnect(); } catch {} } }, 1500);
  });
  peer.on("error", e => {
    const msg = e.type === "unavailable-id" ? "Código em uso — escolha outro"
      : e.type === "peer-unavailable" ? "Central não encontrada — abra a Central no notebook primeiro"
      : "Erro de conexão: " + e.type;
    $("status").textContent = msg;
    // celular: central fora do ar → continua tentando a cada 8 s até ela voltar
    if (modo === "cel" && transmitindo && (e.type === "peer-unavailable" || e.type === "network" || e.type === "server-error" || e.type === "socket-error")) {
      setTimeout(() => { if (transmitindo && performance.now() - ultimaReconexao > 7000) reconectar(); }, 8000);
    }
  });
}

function enviar(obj) { if (conn && conn.open) conn.send(obj); }

/* ===================== Gravação comandada pelo celular ===================== */
// O celular pede à central que grave tudo o que recebe (em arquivos de 2 minutos), mesmo sem ninguém no notebook.
let gravarNaCentral = (() => { try { return localStorage.getItem("gravarCentral") === "1"; } catch { return false; } })();
let gravacaoRemotaAtiva = false;
function gravacaoRemota(ligar) {
  gravacaoRemotaAtiva = !!ligar;
  if (ligar && !gravando) {
    const tentar = (n) => { if (!gravacaoRemotaAtiva || gravando) return;
      if (video.srcObject && video.videoWidth) { iniciarGravacao("remota"); falar("Gravação iniciada a pedido do celular.", 6, "grav", 10000); }
      else if (n > 0) setTimeout(() => tentar(n - 1), 1000); };
    tentar(15);
  }
  if (!ligar && gravando && motivoGrav === "remota") pararGravacao();
}
function mostrarGravarCentral() {

/* ===================== Percurso (GPX) ===================== */
var percurso = [];
function baixarGpx(pontos = percurso, nome) {
  if (!pontos.length) { $("status").textContent = "Ainda não há percurso registrado"; return; }
  const esc = x => String(x).replace(/&/g, "&amp;").replace(/</g, "&lt;");
  const pts = pontos.map(q => `      <trkpt lat="${q.lat.toFixed(6)}" lon="${q.lng.toFixed(6)}"><time>${q.t}</time>${q.cam !== "" ? `<desc>Câmera ${esc(q.cam)}</desc>` : ""}</trkpt>`).join("\n");
  const gpx = `<?xml version="1.0" encoding="UTF-8"?>
<gpx version="1.1" creator="Anjo da Guarda" xmlns="http://www.topografix.com/GPX/1/1">
  <trk><name>Anjo da Guarda — percurso ${pontos[0].t.slice(0, 16).replace("T", " ")}</name>
    <trkseg>
${pts}
    </trkseg>
  </trk>
</gpx>`;
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([gpx], { type:"application/gpx+xml" }));
  const z = n => String(n).padStart(2, "0"), d = new Date();
  a.download = (nome || `anjo_percurso_${d.getFullYear()}${z(d.getMonth()+1)}${z(d.getDate())}_${z(d.getHours())}${z(d.getMinutes())}`) + ".gpx";
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 60000);
}

/* ===================== Eventos ===================== */
document.querySelectorAll("[data-modo]").forEach(b => b.onclick = () => trocarModo(b.dataset.modo));
$("simIniciar").onclick = () => { liberarAudio(); iniciarSimulacao(); };
$("simParar").onclick = () => { pararSimulacao(); $("status").textContent = "Simulação parada"; };
$("rotaDesenhar").onclick = () => {
  desenhandoRota = !desenhandoRota; desenhandoGeo = false;
  $("rotaDesenhar").classList.toggle("ativo", desenhandoRota); $("geoDesenhar").classList.remove("ativo");
  if (desenhandoRota) { pararSimulacao(); rota = []; rotaLinha.setLatLngs(rota); limparCameras(); resetTrajeto();
    $("status").textContent = "Clique no mapa para traçar a rota; depois clique em Iniciar simulação"; }
};
$("seguir").onclick = () => {
  seguir = !seguir;
  $("seguir").classList.toggle("ativo", seguir);
  $("seguir").textContent = "Seguir: " + (seguir ? "ligado" : "desligado");
  if (seguir && posAtual) mapa.setView(posAtual, Math.max(mapa.getZoom(), 17));
};
$("rotaPadrao").onclick = () => {
  rota = ROTA_PADRAO.map(p => L.latLng(p[0], p[1])); rotaLinha.setLatLngs(rota);
  prepararCamerasRota(); resetTrajeto(); mapa.fitBounds(rotaLinha.getBounds().pad(0.2));
};
$("celIniciar").onclick = () => { liberarAudio(); iniciarCelular(); };
$("celParar").onclick = pararCelular;
$("centralAbrir").onclick = () => { liberarAudio(); abrirCentral(); };
$("audioModo").onclick = () => {
  liberarAudio();
  modoAudio = MODOS_AUDIO[(MODOS_AUDIO.indexOf(modoAudio) + 1) % MODOS_AUDIO.length];
  try { localStorage.setItem("modoAudio", modoAudio); } catch {}
  mostrarModoAudio();
  if (modoAudio !== "silencioso") falar({ alertas:"Áudio só com alertas.", resumo:"Áudio com alertas e resumo.", detalhado:"Áudio detalhado." }[modoAudio], 6, null, 0);
  else if ("speechSynthesis" in window) speechSynthesis.cancel();
};
mostrarModoAudio();
$("gravarCentral").onclick = () => {
  gravarNaCentral = !gravarNaCentral;
  try { localStorage.setItem("gravarCentral", gravarNaCentral ? "1" : "0"); } catch {}
  mostrarGravarCentral();
  enviar({ tipo:"gravar", ligar:gravarNaCentral });
};
mostrarGravarCentral();
$("geoDesenhar").onclick = () => {
  desenhandoGeo = !desenhandoGeo; desenhandoRota = false;
  $("geoDesenhar").classList.toggle("ativo", desenhandoGeo); $("rotaDesenhar").classList.remove("ativo");
  if (desenhandoGeo) { definirGeo([]); $("status").textContent = "Clique no mapa para marcar os vértices da área; clique de novo em Desenhar área para concluir"; }
  else { $("status").textContent = geoPontos.length >= 3 ? "Área definida" : "Área precisa de pelo menos 3 pontos";
    if (geoPontos.length >= 3) enviar({ tipo:"geo", pontos:geoPontos.map(q => [q.lat, q.lng]) }); }
};
$("geoLimpar").onclick = () => { definirGeo([]); $("geoAlerta").style.display = "none"; enviar({ tipo:"geo", pontos:[] }); };
$("trocar").onclick = () => { facing = facing === "environment" ? "user" : "environment"; if (stream) abrirCameraLocal(); };
$("baixar").onclick = baixarLog;
$("turnUser").value = lerCfg("turnUser");
$("turnPass").value = lerCfg("turnPass");
$("turnSalvar").onclick = async () => {
  salvarCfg("turnUser", $("turnUser").value.trim());
  salvarCfg("turnPass", $("turnPass").value.trim());
  await iceServers();
};
iceServers();
$("baixarObj").onclick = baixarObjetos;
$("baixarGpx").onclick = () => baixarGpx();
// Limita o crescimento dos registros em memória (sessões longas)
setInterval(() => {
  if (log.length > 20000) log.splice(1, log.length - 15000);
  if (objetosLog.length > 20000) objetosLog.splice(1, objetosLog.length - 15000);
}, 60000);
let somCentral = false;
$("som").onclick = () => {
  somCentral = !somCentral; video.muted = !somCentral;
  if (somCentral) video.play().catch(() => {});
  $("som").textContent = somCentral ? "🔊 Som ligado" : "🔇 Som desligado";
  $("som").classList.toggle("ativo", somCentral);
};
$("microfone").onchange = () => {
  // liga/desliga o microfone durante a transmissão, sem reconectar
  stream?.getAudioTracks().forEach(t => t.enabled = $("microfone").checked);
};
$("gravar").onclick = () => gravando ? pararGravacao() : iniciarGravacao("manual");
$("gravarAlertas").checked = lerCfg("gravarAlertas") !== "0";
$("gravarAlertas").onchange = () => salvarCfg("gravarAlertas", $("gravarAlertas").checked ? "1" : "0");

/* ===================== Início ===================== */

/* ===================== Atualização automática ===================== */
// A cada minuto verifica version.json no GitHub. A central recarrega sozinha e reabre;
// o celular mostra um aviso (recarregar exigiria nova permissão de câmera).
const VERSAO = 21;
async function verificarVersao() {
  try {
    const r = await fetch("version.json?t=" + Date.now(), { cache:"no-store" });
    if (!r.ok) return;
    const { v } = await r.json();
    if (!(v > VERSAO)) return;
    if (modo === "central" && peer && !gravando) {
      const u = new URL(location.href);
      u.searchParams.set("v", v); u.searchParams.set("auto", "central");
      u.searchParams.set("codigo", $("codigoCentral").value.trim());
      location.replace(u.toString());
    } else if (modo === "cel" || modo === "sim") {
      $("status").textContent = `Nova versão v${v} disponível — recarregue a página quando puder`;
    }
  } catch {}
}
setInterval(verificarVersao, 60000);

$("dica").textContent = DICAS.sim;
prepararCamerasRota();
// Reabre a central automaticamente após atualização
(() => {
  const q = new URLSearchParams(location.search);
  if (q.get("auto") === "central") {
    if (q.get("codigo")) $("codigoCentral").value = q.get("codigo");
    trocarModo("central");
    setTimeout(abrirCentral, 500);
  }
})();
mapa.fitBounds(rotaLinha.getBounds().pad(0.2));
cocoSsd.load({ base:"lite_mobilenet_v2" })
  .then(m => { model = m; $("status").textContent = "Pronto"; if (video.srcObject) iniciarDeteccao(); })
  .catch(e => $("status").textContent = "Erro ao carregar IA: " + e.message);
</script>
